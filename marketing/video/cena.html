<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>RELATORIO SKIN — vídeo de marketing (cenas)</title>
<!--
  Vídeo de marketing do RELATORIO SKIN — cenas.
  Tudo aqui é função do tempo: window.renderAt(t) desenha o quadro do segundo t
  (sem animação "ao vivo"), então o render.js pode tirar os quadros um a um.
  Os efeitos sonoros são declarados em cada cena (lista "sons") e exportados por
  window.eventosSonoros(); o trilha.py sintetiza o áudio nos mesmos instantes.
  Camadas: fundo GLSL (WebGL) · cenas (DOM) · cortina de transição · flash · granulado · vinheta.
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700&family=Caveat:wght@500;700&display=block" rel="stylesheet">
<style>

*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}

#preto{background:#000;z-index:23}
#grao{position:absolute;inset:-64px;pointer-events:none;z-index:22;display:none} /* o granulado é aplicado pelo ffmpeg (filtro noise) no render */

<body>
<div id="palco">
  <canvas id="gl" width="960" height="540"></canvas>
  <div id="cenas"></div>
  <div id="wipe"><i id="wp2"></i><i id="wp1"></i></div>
  <div id="flash"></div>
  <div id="grao"></div>
  <div id="vinheta"></div>
  <div id="preto"></div>
</div>

<script type="x-shader/x-fragment" id="frag">
// Fundo "aurora" em GLSL: ruído fractal (fbm) com distorção de domínio.
// u_mood: 0 = problema (fumaça grafite e brasas) · 1 = solução (floresta, sálvia, laranja, ouro).
precision highp float;
uniform vec2 u_res;
uniform float u_t, u_mood, u_quente, u_intens, u_flash;
float hash(vec2 p){ p = fract(p * vec2(234.34, 435.345)); p += dot(p, p + 34.23); return fract(p.x * p.y); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
}
float fbm(vec2 p){
  float v = 0.0, a = 0.5; mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 5; i++) { v += a * noise(p); p = m * p; a *= 0.5; }
  return v;
}
void main(){
  vec2 p = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y;
  float t = u_t * 0.09;
  vec2 q = vec2(fbm(p * 1.3 + vec2(0.0, t)), fbm(p * 1.3 + vec2(5.2, -t * 0.8)));
  vec2 r = vec2(fbm(p * 1.7 + 2.0 * q + vec2(1.7, 9.2) + t * 0.6), fbm(p * 1.7 + 2.0 * q + vec2(8.3, 2.8) - t * 0.4));
  float n = fbm(p * 1.5 + 2.2 * r);
  vec3 base = vec3(0.051, 0.055, 0.051);
  vec3 cp = mix(vec3(0.11, 0.105, 0.10), vec3(0.46, 0.12, 0.09), smoothstep(0.55, 0.95, n));
  vec3 cs = mix(vec3(0.05, 0.17, 0.11), vec3(0.56, 0.65, 0.43), smoothstep(0.35, 0.8, n));
  cs = mix(cs, vec3(1.0, 0.60, 0.30), smoothstep(0.55, 0.95, r.x) * 0.65);
  cs = mix(cs, vec3(0.96, 0.77, 0.38), smoothstep(0.5, 0.9, q.y) * (0.22 + 0.6 * u_quente));
  vec3 col = mix(cp, cs, u_mood);
  float vig = smoothstep(1.35, 0.15, length(p * vec2(0.85, 1.1)));
  float k = (0.2 + 0.8 * n * n) * vig * u_intens;
  col = mix(base, col, k);
  col += u_flash * vec3(1.0, 0.97, 0.9);
  gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
'use strict';
/* =====================================================================
   0. MOTOR: easing, interpolação, criação de elementos, texto cinético
   ===================================================================== */
const W = 1920, H = 1080, DUR = 60;
const $ = s => document.querySelector(s);
const palco = $('#palco');
const E = {
  lin: x => x,
  out: x => 1 - Math.pow(1 - x, 3),
  out5: x => 1 - Math.pow(1 - x, 5),
  in: x => x * x * x,
  io: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  back: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  el: x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (2 * Math.PI / 3)) + 1
};
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const pr = (t, t0, d) => cl((t - t0) / d);
const lerp = (a, b, p) => a + (b - a) * p;
const k = (t, t0, t1, a, b, e = 'out') => lerp(a, b, E[e](pr(t, t0, t1 - t0)));
// Gerador pseudoaleatório com semente: o mesmo vídeo em toda renderização.
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function mk(tag, cls, html, par, x, y) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  if (x != null) { e.style.left = x + 'px'; e.style.top = y + 'px'; }
  (par || palco).appendChild(e);
  return e;
}
// Aplica posição/escala/rotação/opacidade/desfoque ao elemento ancorado no ponto (left, top).
function ap(el, o) {
  o = o || {};
  const x = o.x || 0, y = o.y || 0, s = o.s == null ? 1 : o.s, r = o.r || 0, op = o.o == null ? 1 : o.o, b = o.b || 0;
  const sx = o.sx == null ? s : o.sx, sy = o.sy == null ? s : o.sy;
  const base = el.classList.contains('esq') ? 'translate(0,-50%)' : 'translate(-50%,-50%)';
  el.style.transform = base + ' translate(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px) scale(' + sx.toFixed(4) + ',' + sy.toFixed(4) + ') rotate(' + r.toFixed(2) + 'deg)';
  el.style.opacity = cl(op).toFixed(3);
  el.style.filter = b > .15 ? 'blur(' + b.toFixed(1) + 'px)' : '';
  if (!el._w) el.style.visibility = op <= .002 ? 'hidden' : 'visible';
}
// Texto palavra por palavra. "*palavra*" = destaque em gradiente; "|" = quebra de linha.
function txt(par, x, y, str, cls, esq) {
  const el = mk('div', 'a txt ' + (cls || '') + (esq ? ' esq' : ' c'), '', par, x, y);
  el._w = [];

  palavras(r.c, tl, 2.8, null, { stg: .05 }); palavras(r.d, tl, 3.2, null, { stg: .1, dy: 120 });
}, [[0, 'rebobinar', { dur: 1.8 }], [1.55, 'sino', { p: 76 }], [3.2, 'sino', { p: 84 }]]);

/* ---------- ATO 3 · CRIE SUA CONTA ---------- */

// 15. Chamada para ação (50–57 s)
cena('cta', 50, 57, root => {
  const R = rng(33), conf = [];
  for (let i = 0; i < 70; i++) {
    const el = mk('div', 'a confete', '', root, 1010, 585); el.style.zIndex = 6;
    el.style.background = ['#A7B58A', '#FFA65B', '#E3B861', '#F3F1E9', '#C2CE9E', '#E8736B'][i % 6];
    const a = -Math.PI / 2 + (R() - .5) * 2.6, v = 900 + R() * 1100;
    el._vx = Math.cos(a) * v; el._vy = Math.sin(a) * v; el._rr = (R() - .5) * 1400; el._s = .6 + R() * .9;
    conf.push(el);
  }
  const sim = mk('img', 'a', null, root, 960, 175); sim.src = '../../assets/marca/skin-simbolo.webp'; sim.style.width = '140px'; sim.style.borderRadius = '32px';
  const aneis = [mk('div', 'a anel', '', root, 960, 560), mk('div', 'a anel', '', root, 960, 560)];
  const bt = mk('div', 'a botao', 'Criar conta grátis →', root, 960, 560);
  const cur = mk('div', 'a cursor', SVG_CURSOR, root, 0, 0); cur.style.transformOrigin = '0 0';
  const url = mk('div', 'a url-cta', '', root, 960, 745);
  const selos = ['✓ Grátis para começar', '✓ Sem instalar nada', '✓ Funciona no celular'].map((s, i) => mk('div', 'a selo', s, root, 960 + (i - 1) * 540, 900));
  return { conf, sim, aneis, bt, cur, url, selos, h: txt(root, 960, 345, 'Crie sua conta *grátis.*', 'h2 c') };
}, (tl, r) => {
  let final = tl > 6 ? .06 * Math.exp(-(tl - 6) * 5) : 0;
  const some = pr(tl, 6.55, .45);
  ap(r.sim, { s: lerp(0, 1, E.back(pr(tl, 0, .45))) + final, o: pr(tl, 0, .1) * (1 - some) });
  palavras(r.h, tl, .15, null, { stg: .09, dy: 90 });
  r.h.style.opacity = (1 - some).toFixed(3);
  const clique = tl > 2.45 && tl < 2.58;
  ap(r.bt, { s: lerp(.3, 1, E.el(pr(tl, 1.0, .9))) * (clique ? .93 : 1) + (tl > 2.58 ? .07 * Math.exp(-(tl - 2.58) * 6) : 0) + final, o: pr(tl, 1.0, .12) * (1 - some) });
  r.aneis.forEach((an, i) => { const ciclo = ((tl - 1.4 - i * .6) % 1.2 + 1.2) % 1.2; ap(an, { s: 1 + ciclo * .35, o: tl > 1.4 ? (1 - ciclo / 1.2) * .6 * (1 - some) : 0 }); });
  const m = E.io(pr(tl, 1.7, .7));
  r.cur.style.transform = 'translate(' + lerp(1860, 1010, m).toFixed(1) + 'px,' + lerp(1060, 585, m).toFixed(1) + 'px) scale(' + (clique ? .85 : 1) + ')';
  r.cur.style.opacity = (pr(tl, 1.65, .15) * (1 - pr(tl, 3.1, .3))).toFixed(3);
  r.conf.forEach(el => { const d = tl - 2.5; if (d < 0) { ap(el, { o: 0 }); return; } const f = 1 - Math.exp(-d * 3); ap(el, { x: el._vx * f / 3, y: el._vy * f / 3 + d * d * 500, r: el._rr * d, s: el._s, o: 1 - pr(d, 1.1, .7) }); });
  const u = digitado('relatorio.skin', tl, 3.25, 3.85);
  r.url.innerHTML = '🔒 ' + esc(u) + (tl > 3.2 && Math.floor(tl * 4) % 2 === 0 ? '<span style="display:inline-block;width:5px;height:56px;background:#A7B58A;vertical-align:-8px;margin-left:4px"></span>' : '');
  ap(r.url, { o: pr(tl, 3.1, .15) * (1 - some), s: lerp(.8, 1, E.out(pr(tl, 3.1, .3))) + final });
  r.selos.forEach((el, i) => { const t0 = 4.2 + i * .35; ap(el, { s: lerp(.4, 1, E.back(pr(tl, t0, .35))) + final, o: pr(tl, t0, .1) * (1 - some), y: (1 - E.out(pr(tl, t0, .35))) * 50 }); });
}, [[.15, 'swipe'], [1.0, 'pop', { p: 1 }], [2.45, 'clique'], [2.5, 'brilho', { dur: 1.0 }], [2.55, 'sucesso'], [3.25, 'digitar', { dur: .6 }], [4.2, 'pop', { p: 0 }], [4.55, 'pop', { p: 1 }], [4.9, 'pop', { p: 2 }], [6.0, 'brilho', { dur: .8 }]]);

// 16. Assinatura (56.7–60 s)
cena('fim', 56.7, 60, root => {
  const sim = mk('img', 'a', null, root, 960, 300); sim.src = '../../assets/marca/skin-simbolo.webp'; sim.style.width = '170px'; sim.style.borderRadius = '38px';
  const marca = mk('div', 'a marca-skin', '<small>RELATORIO</small><b>SKIN</b>', root, 960, 520);
  marca.style.transform = 'none';
  const ax = mk('div', 'a', '<img src="../../assets/marca/axion-escuro-sm.webp" alt="" style="width:260px;display:block;margin:0 auto"><div style="margin-top:8px;text-align:center;font:600 20px Inter;letter-spacing:.24em;color:#B6B7AE">PROPRIEDADE DA AXION PROEDUQ</div>', root, 960, 950);
  return { sim, marca, ax, url: txt(root, 960, 720, '*relatorio.skin*', 'h3 c'), cta: txt(root, 960, 810, 'Crie sua conta grátis. Ganhe tempo de volta.', 'p c') };
}, (tl, r) => {
  const e = pr(tl, .15, .5);
  ap(r.sim, { o: e, s: lerp(.8, 1, E.out(e)) });
  ap(r.marca, { o: pr(tl, .25, .5), s: lerp(.92, 1, E.out(pr(tl, .25, .6))), y: 0 });
  palavras(r.url, tl, .6, null, { stg: .05 }); palavras(r.cta, tl, .9, null, { stg: .03 });
  ap(r.ax, { o: pr(tl, 1.1, .5) });
}, []);

/* =====================================================================
   2. CAMADAS GLOBAIS: transições, flash, tremor, fundo GLSL, granulado
   ===================================================================== */
const WIPES = [[19, '#FFA65B'], [22, '#A7B58A'], [26, '#E3B861'], [29, '#F3F1E9'], [32, '#A7B58A'], [35, '#FFA65B'], [39, '#F3F1E9'], [43, '#C2CE9E']];
const FLASHES = [[16, .45, .95], [50, .35, .6], [56, .5, .3]];
const TREMORES = [[16, 26, .55], [30.9, 10, .3], [50, 12, .4], [4 + 4.95, 8, .6]];
const wp = $('#wipe'), wp1 = $('#wp1'), wp2 = $('#wp2');
function transicoes(t) {
  const w = WIPES.find(w => t >= w[0] - .3 && t <= w[0] + .3);
  if (!w) { wp.style.display = 'none'; return; }
  wp.style.display = 'block';
  const d = t - w[0], x = d < 0 ? lerp(-1.3, 0, E.in(pr(d, -.3, .3))) : lerp(0, 1.3, E.out(pr(d, 0, .3)));
  wp1.style.background = w[1]; wp2.style.background = '#0D0E0D';
  wp1.style.transform = 'translateX(' + (x * W).toFixed(1) + 'px) skewX(-14deg)';
  wp2.style.transform = 'translateX(' + ((x + (d < 0 ? .1 : -.1)) * W).toFixed(1) + 'px) skewX(-14deg)';
}
function flashes(t) { let a = 0; FLASHES.forEach(f => { if (t >= f[0]) a = Math.max(a, f[2] * Math.exp(-(t - f[0]) / f[1] * 3)); }); $('#flash').style.opacity = a.toFixed(3); return a; }
function tremor(t) {
  let x = 0, y = 0;
  TREMORES.forEach(s => { const d = t - s[0]; if (d >= 0 && d < s[2]) { const a = s[1] * (1 - d / s[2]); x += Math.sin(d * 83 + s[0]) * a; y += Math.cos(d * 71 + s[0] * 2) * a; } });
  $('#cenas').style.transform = 'translate(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px)';
}
function preto(t) {
  let a = 1 - pr(t, 0, .35);
  a = Math.max(a, pr(t, 15.72, .12) * (1 - pr(t, 16, .01)));
  a = Math.max(a, pr(t, 59.2, .8));
  $('#preto').style.opacity = a.toFixed(3);
}
// Granulado de filme: textura gerada uma vez, deslocada a cada quadro.
(function () {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), im = g.createImageData(256, 256), R = rng(3);
  for (let i = 0; i < im.data.length; i += 4) { const claro = R() < .5, v = claro ? 255 : 0; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = Math.floor(R() * (claro ? 14 : 22)); }
  g.putImageData(im, 0, 0); $('#grao').style.backgroundImage = 'url(' + c.toDataURL() + ')';
})();
// WebGL: fundo em GLSL (meia resolução, esticado — é um fundo suave).
const GL = (function () {
  const cv = $('#gl'), gl = cv.getContext('webgl', { preserveDrawingBuffer: true, antialias: false });
  if (!gl) { cv.style.background = 'radial-gradient(ellipse at 60% 40%,#1a3a2a,#0D0E0D 70%)'; return null; }
  const sh = (tipo, src) => { const s = gl.createShader(tipo); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const pg = gl.createProgram();
  gl.attachShader(pg, sh(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
  gl.attachShader(pg, sh(gl.FRAGMENT_SHADER, $('#frag').textContent));
  gl.linkProgram(pg); gl.useProgram(pg);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pg, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const u = n => gl.getUniformLocation(pg, n);
  const U = { res: u('u_res'), t: u('u_t'), mood: u('u_mood'), quente: u('u_quente'), intens: u('u_intens'), flash: u('u_flash') };
  gl.uniform2f(U.res, cv.width, cv.height);
  return { gl, U };
})();
function fundo(t, flash) {
  if (!GL || window.SEM_GL) return;
  const { gl, U } = GL;
  const mood = pr(t, 15.95, .15);
  const intens = t < 16 ? lerp(.35, .55, pr(t, 4, 9)) * (1 - pr(t, 14.6, 1.2) * .7) : t < 46 ? .9 : 1;
  const quente = pr(t, 45.8, .8) * (1 - pr(t, 50, .5) * .6);
  gl.uniform1f(U.t, t); gl.uniform1f(U.mood, mood); gl.uniform1f(U.quente, quente); gl.uniform1f(U.intens, intens); gl.uniform1f(U.flash, flash * .35);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* =====================================================================
   3. API usada pelo render.js
   ===================================================================== */
window.renderAt = function (t) {
  for (const c of CENAS) {
    const on = t >= c.ini && t < c.fim;
    c.root.style.display = on ? 'block' : 'none';
    if (on) c.quadro(t - c.ini, c.r, t);
  }
  transicoes(t);
  const f = flashes(t);
  tremor(t); preto(t); fundo(t, f);
};
window.eventosSonoros = function () {
  const ev = [];
  CENAS.forEach(c => c.sons.forEach(s => ev.push(Object.assign({ t: +(c.ini + s[0]).toFixed(3), som: s[1] }, s[2] || {}))));
  WIPES.forEach(w => ev.push({ t: +(w[0] - .3).toFixed(3), som: 'swipe' }));
  return ev.sort((a, b) => a.t - b.t);
};
window.DURACAO = DUR;
// Pronto quando as fontes e as imagens carregaram.
Promise.all([document.fonts.ready, ...Array.from(document.images).map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; }))]).then(() => { window.renderAt(0); window.PRONTO = true; });
// Prévia no navegador: ?t=12.5 mostra o quadro desse segundo; ?tocar=1 anima em tempo real.
(function () {
  const q = new URLSearchParams(location.search);
  if (q.has('t')) setTimeout(() => window.renderAt(parseFloat(q.get('t'))), 600);
  if (q.has('tocar')) { const t0 = performance.now(); const f = () => { const t = (performance.now() - t0) / 1000; window.renderAt(t % DUR); requestAnimationFrame(f); }; setTimeout(f, 600); }
})();
</script>

name: Seguranca

# Roda em todo push e PR, toda segunda-feira e sob demanda.
# Regras e como agir em cada falha: SEGURANCA.md.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  segredos:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar gitleaks (versao fixa + checksum)
        env:
          GL_VERSAO: "8.28.0"
          GL_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
        run: |
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSAO}/gitleaks_${GL_VERSAO}_linux_x64.tar.gz"
          echo "${GL_SHA256}  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks && rm gl.tgz

      - name: Arquivos atuais
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Commits novos deste push/PR
        env:
          ANTES: ${{ github.event.before || github.event.pull_request.base.sha }}
          DEPOIS: ${{ github.sha }}
        run: |
          if [ -n "$ANTES" ] && [ "$ANTES" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="$ANTES..$DEPOIS"
          else
            ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="-1 $DEPOIS"
          fi

  verificador:
    name: Regras do projeto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: check-seguranca (segredos, RLS, SRI, cabecalhos, publicacao)
        run: node scripts/check-seguranca.js
      - name: Site gerado sem arquivos internos nem segredos
        run: |
          npm ci --ignore-scripts
          npm run build:pages
          node scripts/check-seguranca.js --dist

  dependencias:
    name: Dependencias vulneraveis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: npm audit (raiz)
        run: npm audit --package-lock-only --audit-level=high
      - name: npm audit (video de marketing)
        working-directory: marketing/video
        run: npm audit --package-lock-only --audit-level=high

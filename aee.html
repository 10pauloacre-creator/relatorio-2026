<style>
/* Base visual do Meu Diário (copiada de meu-diario.html) */
:root{--vd:#1a3a2a;--vm:#2d6147;--vc:#4a9467;--vs:#c8e6d4;--ou:#c9a84c;--os:#f5e6be;--cr:#faf8f2;--ce:#2b2b2b;--cm:#5a5a5a;--cl:#e8e5de;--ra:#c0392b;--rs:#fdecea;--ai:#2980b9;--og:#876020;--card:#fff;--ss:0 4px 24px rgba(26,58,42,.10);--sc:0 2px 12px rgba(26,58,42,.08);--r:14px;--rs2:8px;
  /* Tokens próprios do Meu Diário (redefinidos no modo escuro). */
  --md-sup:#fff;--md-sup2:#faf8f2;--md-sup3:#f5f3ee;--md-linha:#e8e5de;--md-titulo:#1a3a2a;--md-acento:#2d6147;--md-acento-txt:#fff;--md-destaque:#2d6147;--md-fundo:#faf8f2}
html.dark-2026{--md-sup:#191c1f;--md-sup2:#202327;--md-sup3:#272b30;--md-linha:#383d43;--md-titulo:#f4f5f6;--md-acento:#ffa65b;--md-acento-txt:#1b130b;--md-destaque:#ffa65b;--md-fundo:#111315}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--md-fundo);color:var(--ce);min-height:100vh}
button{font-family:inherit}
a{color:var(--md-destaque)}
/* ── Cabeçalho e abas (mesmo desenho da Casavequia) ── */
.cab{background:linear-gradient(135deg,var(--vd),var(--vm) 60%,var(--vc));color:#fff;position:relative;overflow:hidden}
.cab::before{content:'';position:absolute;top:-60px;right:-60px;width:260px;height:260px;border-radius:50%;background:rgba(201,168,76,.15)}
.cab-barra{max-width:1200px;margin:0 auto;padding:14px 40px 0;position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px}
@media(max-width:760px){.cab-barra{padding:12px 16px 0}}
.cab-i{max-width:1200px;margin:0 auto;padding:14px 40px 24px;position:relative;z-index:1;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.md-avatar{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(201,168,76,.7);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:1.7rem;font-weight:700;color:#f5e6be;flex-shrink:0;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.cab-t{flex:1;min-width:220px}
.cab-t h1{font-family:'Playfair Display',serif;font-size:1.7rem;font-weight:700;line-height:1.2}
.cab-t .sub{font-size:.8rem;opacity:.82;margin-top:4px;font-weight:300;letter-spacing:.04em;text-transform:uppercase}
.cab-t .prof{margin-top:9px;display:inline-flex;align-items:center;gap:7px;background:rgba(201,168,76,.25);border:1px solid rgba(201,168,76,.5);border-radius:20px;padding:4px 13px;font-size:.8rem;font-weight:500;color:var(--os);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md-cab-acoes{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.md-sync{font-size:.74rem;background:rgba(255,255,255,.14);border-radius:999px;padding:6px 12px;white-space:nowrap}
.md-sair{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.8rem;cursor:pointer}
.md-voltar{text-decoration:none;white-space:nowrap}
.md-avatar{overflow:hidden}.md-avatar img{width:100%;height:100%;object-fit:cover;display:block}
#modo-btns{display:flex;gap:6px}
#modo-btns button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#modo-btns .btn-claro{background:#fff;border-color:#e8e5de;color:#c9a84c}
#modo-btns .btn-escuro{background:#1a3a2a;border-color:#4a9467;color:#c9a84c}
#modo-btns button.ativo{transform:scale(1.12);box-shadow:0 4px 14px rgba(0,0,0,.35);border-color:#c9a84c}
.nav-w{background:var(--vd);border-bottom:3px solid var(--ou);position:sticky;top:0;z-index:100}
.nav-i{max-width:1200px;margin:0 auto;display:flex;align-items:center;padding:0 40px;overflow-x:auto;scrollbar-width:none}
.nav-i::-webkit-scrollbar{display:none}
.nb{padding:12px 15px;background:transparent;border:none;color:rgba(255,255,255,.6);font-size:.8rem;font-weight:500;cursor:pointer;transition:all .2s;position:relative;white-space:nowrap;flex-shrink:0}
.nb:hover{color:#fff}.nb.on{color:var(--ou);font-weight:700}
.nb.on::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--ou);margin-bottom:-3px}
.sp{width:1px;height:16px;background:rgba(255,255,255,.15);flex-shrink:0;margin:0 1px}
.main{max-width:1200px;margin:0 auto;padding:30px 40px 60px}
.sec{display:none;animation:fi .3s ease}.sec.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.th{display:flex;align-items:center;gap:15px;margin-bottom:22px;padding-bottom:14px;border-bottom:2px solid var(--md-linha);flex-wrap:wrap}
.tb{background:var(--vm);color:#fff;font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;padding:9px 15px;border-radius:var(--rs2);line-height:1;flex-shrink:0}
.tb.gz{background:#444}.tb.ou{background:linear-gradient(135deg,#c9a84c,#e8c86a)}.tb.mr{background:linear-gradient(135deg,#8c6a2a,#d8b45b)}.tb.az{background:#1a5276}.tb.ia{background:linear-gradient(135deg,#1a1a2e,#2d3a6e)}
.ti{flex:1;min-width:200px}
.ti h2{font-family:'Playfair Display',serif;font-size:1.25rem;color:var(--md-titulo)}
.ti p{font-size:.82rem;color:var(--cm);margin-top:2px}
.md-acoes{display:flex;gap:10px;flex-wrap:wrap;margin:-8px 0 20px}
.sr{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:13px;margin-bottom:24px}
.sc2{background:var(--md-sup);border-radius:var(--rs2);padding:15px 17px;box-shadow:var(--sc);border-left:4px solid var(--vc)}
.sc2 .n{font-family:'DM Mono',monospace;font-size:1.65rem;font-weight:500;color:var(--vm);line-height:1}
.sc2 .l{font-size:.7rem;color:var(--cm);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
footer{background:var(--vd);color:rgba(255,255,255,.55);text-align:center;padding:18px 20px;font-size:.76rem;letter-spacing:.04em}
footer a{color:rgba(255,255,255,.75)}
/* ── Componentes do Meu Diário ── */
.md-btn{border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:.84rem;cursor:pointer;background:var(--md-sup3);color:var(--ce);border:1px solid var(--md-linha)}
.md-btn.pri{background:var(--md-acento);color:var(--md-acento-txt);border-color:var(--md-acento)}
.md-btn.perigo{background:var(--rs);color:var(--ra);border-color:#f5c6c0}
.md-btn.mini{padding:6px 10px;font-size:.75rem;border-radius:8px}
.md-btn:disabled{opacity:.5;cursor:not-allowed}
.md-card{background:var(--md-sup);border-radius:var(--r);box-shadow:var(--ss);padding:18px 20px;margin-bottom:16px}
.md-card h3{font-family:'Playfair Display',serif;color:var(--md-titulo);font-size:1.08rem;margin-bottom:10px}
.md-card p{font-size:.88rem;line-height:1.55;color:var(--cm)}
.md-f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.md-f label{font-size:.7rem;font-weight:700;color:var(--md-destaque);text-transform:uppercase;letter-spacing:.05em}
.md-f input,.md-f select,.md-f textarea,.md-in{padding:9px 11px;border:2px solid var(--md-linha);border-radius:10px;font:inherit;font-size:.9rem;color:var(--ce);background:var(--md-sup2);width:100%}
.md-f textarea{min-height:120px;resize:vertical}
.md-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.md-vazio{text-align:center;padding:40px 20px;color:var(--cm);font-size:.92rem}
.md-cont{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.md-cc{background:var(--md-sup);border-radius:12px;box-shadow:var(--ss);padding:14px 16px;border-top:4px solid var(--vc)}
.md-cc h4{font-size:.95rem;color:var(--md-titulo)}
.md-cc .sub{font-size:.76rem;color:var(--cm);margin:2px 0 10px}
.md-bar{height:9px;background:var(--md-linha);border-radius:99px;overflow:hidden;margin:4px 0 8px}
.md-bar i{display:block;height:100%;background:var(--vc)}
.md-bar.ano i{background:var(--ou)}
.md-lbl{display:flex;justify-content:space-between;font-size:.74rem;color:var(--cm)}
.md-bims{display:flex;gap:4px;margin-top:6px}
.md-bims span{flex:1;text-align:center;font-size:.66rem;padding:4px 0;border-radius:6px;background:var(--md-linha);color:var(--cm)}
.md-bims span.co{background:var(--vs);color:var(--vm);font-weight:700}
.md-bims span.at{background:var(--os);color:var(--og);font-weight:700}
.md-h3{font-family:'Playfair Display',serif;color:var(--md-titulo);margin:18px 0 10px;font-size:1.1rem}
.md-alunos{display:flex;flex-wrap:wrap;gap:6px}
.md-alunos button{border:1px solid var(--md-linha);background:var(--md-sup2);color:var(--ce);border-radius:999px;padding:5px 11px;font-size:.78rem;cursor:pointer}
.md-alunos button.tr{opacity:.5;text-decoration:line-through}
.md-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.md-row .md-in{flex:1}
.md-row .n{font-family:'DM Mono',monospace;font-size:.78rem;width:28px;color:var(--cm)}
.md-row label{font-size:.76rem;display:flex;gap:4px;align-items:center;white-space:nowrap}
.md-x{background:none;border:none;color:var(--ra);font-size:1.05rem;cursor:pointer;padding:4px}
details.md-turma{border:1px solid var(--md-linha);border-radius:12px;padding:0 14px;margin-bottom:12px;background:var(--md-sup)}
details.md-turma>summary{cursor:pointer;padding:13px 0;font-weight:700;color:var(--md-titulo)}
details.md-turma[open]>summary{border-bottom:1px solid var(--md-linha);margin-bottom:12px}
.md-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1a3a2a;color:#fff;padding:10px 18px;border-radius:999px;font-size:.84rem;z-index:20000;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:92vw;text-align:center}
.md-tabela{width:100%;border-collapse:collapse;font-size:.86rem}
.md-tabela td{padding:7px 4px;border-bottom:1px solid var(--md-linha)}
/* ── Cards de diário (padrão da Casavequia) ── */
.ea{background:var(--md-sup);border-radius:var(--r);box-shadow:var(--ss);margin-bottom:18px;overflow:hidden;transition:box-shadow .2s}
.ea:hover{box-shadow:0 6px 32px rgba(26,58,42,.14)}
.eh{display:flex;align-items:center;cursor:pointer;user-select:none}
.edb{background:var(--vd);color:#fff;padding:17px 19px;min-width:96px;text-align:center;flex-shrink:0}
.edb .d{font-family:'DM Mono',monospace;font-size:1.9rem;font-weight:500;line-height:1}
.edb .my{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;opacity:.74;margin-top:2px}
.em{flex:1;padding:13px 19px;display:flex;flex-direction:column;gap:5px;min-width:0}
.ed{font-family:'Playfair Display',serif;font-size:1.02rem;color:var(--vd);font-weight:600}
.ec{display:flex;flex-wrap:wrap;gap:5px}
.ch{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:.72rem;font-weight:500}
.ch-h{background:var(--vs);color:var(--vm)}.ch-p{background:var(--os);color:#7a5c10}
.ch-a{background:var(--rs);color:var(--ra)}.ch-i{background:#dbeeff;color:var(--ai)}
.et{padding:17px 19px;color:var(--cm);font-size:.95rem;transition:transform .25s;flex-shrink:0}.et.op{transform:rotate(180deg)}
.ec2{display:none;border-top:1px solid var(--cl)}.ec2.on{display:block}
.itabs{display:flex;background:#f5f3ee;border-bottom:1px solid var(--cl);padding:0 20px;overflow-x:auto}
.itab{padding:9px 13px;background:transparent;border:none;font-size:.77rem;font-weight:500;cursor:pointer;color:var(--cm);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.itab:hover{color:var(--vd)}.itab.on{color:var(--vm);border-bottom-color:var(--vm);font-weight:700}
.ipane{display:none;padding:18px 22px 22px}.ipane.on{display:block}
.st{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--cm);font-weight:700;margin:16px 0 7px}.st:first-child{margin-top:0}
.ct{background:var(--cr);border-left:3px solid var(--vc);padding:11px 15px;border-radius:0 var(--rs2) var(--rs2) 0;font-size:.88rem;line-height:1.65}
.ol{display:flex;flex-direction:column;gap:9px}
.oi{background:var(--rs);border:1px solid #f5c6c0;border-radius:var(--rs2);padding:11px 15px;display:flex;gap:11px;align-items:flex-start}
.oi.nt{background:#f0f7ff;border-color:#bdd9f5}
.oi-ic{font-size:1.05rem;flex-shrink:0}
.oa{font-weight:600;font-size:.86rem;color:var(--ra);margin-bottom:2px}.oi.nt .oa{color:var(--ai)}.od{font-size:.83rem;line-height:1.5}
.ng{background:var(--os);border:1px solid #e0c87a;border-radius:var(--rs2);padding:11px 15px;font-size:.84rem;line-height:1.6}
.ai2{margin-top:14px;background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:var(--rs2);padding:15px 17px;color:#fff}
.ai2h{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.ai2h .tg{background:rgba(201,168,76,.25);color:var(--ou);border:1px solid rgba(201,168,76,.4);border-radius:4px;font-size:.64rem;font-weight:700;letter-spacing:.12em;padding:2px 7px;text-transform:uppercase}
.ai2h span{font-size:.8rem;opacity:.7}
.ai2i{background:rgba(255,255,255,.07);border-radius:6px;padding:9px 11px;margin-bottom:7px;font-size:.83rem;line-height:1.55}
.ai2a{font-family:'DM Mono',monospace;color:var(--ou);font-size:.76rem;margin-bottom:2px}
.ai2p{display:inline-flex;background:rgba(192,57,43,.25);color:#ff8a8a;border-radius:4px;padding:1px 6px;font-size:.7rem;font-weight:600;margin-bottom:3px}
.ai2p.warn{background:rgba(230,126,34,.25);color:#ffc08a}.ai2p.grave{background:rgba(192,57,43,.45);color:#ff6b6b}
.ai2t{opacity:.85}.ai2s{margin-top:9px;border-top:1px solid rgba(255,255,255,.1);padding-top:9px;font-size:.78rem;opacity:.75;font-style:italic}
.lembrete{background:#1a1a2e;border:2px dashed var(--ou);border-radius:var(--rs2);padding:12px 16px;margin:14px 0;color:#fff}
.lembrete-tag{display:inline-flex;background:rgba(201,168,76,.3);color:var(--ou);border-radius:4px;font-size:.66rem;font-weight:700;letter-spacing:.1em;padding:2px 8px;text-transform:uppercase;margin-bottom:8px}
.lembrete-txt{font-size:.83rem;line-height:1.6;opacity:.9}
.atv-tema{background:var(--cr);border-left:3px solid var(--ou);padding:10px 14px;border-radius:0 var(--rs2) var(--rs2) 0;font-size:.87rem;margin-bottom:12px}
.atv-av{background:var(--os);border:1px solid #e0c87a;border-radius:var(--rs2);padding:9px 13px;font-size:.81rem;margin-bottom:12px;display:flex;gap:8px}
.md-mstat{font-size:.74rem;color:var(--cm);margin-bottom:10px;display:flex;gap:14px;flex-wrap:wrap}.md-mstat strong{color:var(--ce)}
.md-mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:5px}
.md-m{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:6px;font-size:.8rem;cursor:pointer;border:none;text-align:left;background:var(--md-sup3);color:var(--ce)}
.md-m .n{font-family:'DM Mono',monospace;font-size:.67rem;opacity:.6;width:20px;flex-shrink:0}
.md-m .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md-m .tag{font-size:.62rem;font-weight:700}
.md-m.pr,.md-m.fz{background:#e6f6ec;color:#1f6b43}.md-m.fa,.md-m.nf{background:#fde2df;color:#a4291d}.md-m.fj{background:#fff4d6;color:#7a5c10}

.md-ajuda{font-size:.74rem;color:var(--cm);margin-bottom:8px}
/* ── Escola, ano letivo e cadastro de turmas (Etapa 14) ── */
.md-ano{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;color:var(--md-destaque);background:var(--md-sup);border:1px solid var(--md-linha);border-radius:999px;padding:5px 6px 5px 14px}
.md-ano select{border:none;background:var(--md-sup3);color:var(--ce);border-radius:999px;padding:6px 10px;font:inherit;font-weight:700;cursor:pointer}
.md-opcoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:14px}
.md-opcao{display:flex;flex-direction:column;gap:5px;text-align:left;border:1px solid var(--md-linha);background:var(--md-sup2);color:var(--ce);border-radius:14px;padding:16px;cursor:pointer;transition:border-color .15s,transform .15s}
.md-opcao:hover{border-color:var(--md-destaque);transform:translateY(-2px)}
.md-opcao span{font-size:1.6rem}.md-opcao b{font-size:.95rem;color:var(--md-titulo)}.md-opcao small{font-size:.78rem;color:var(--cm);line-height:1.45}
.md-escola{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.md-escola-face{width:132px;height:132px;border-radius:22px;background:linear-gradient(160deg,#2a3324,#141712);display:flex;align-items:center;justify-content:center;font-size:3.6rem;overflow:hidden;flex-shrink:0;box-shadow:var(--sc)}
.md-escola-face img{width:100%;height:100%;object-fit:cover}
.md-icones{display:flex;flex-wrap:wrap;gap:6px}
.md-icones button{width:40px;height:40px;border-radius:10px;border:2px solid var(--md-linha);background:var(--md-sup2);font-size:1.25rem;cursor:pointer}
.md-icones button.on{border-color:var(--md-destaque)}
.md-inep{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--md-sup2);border:1px solid var(--md-linha);font-size:.86rem;line-height:1.55}
.md-inep span{color:var(--cm);font-size:.8rem}
.md-perigo{border:2px solid rgba(192,57,43,.45)}
.md-perigo h3{color:var(--ra)!important}
.md-perigo-l{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--md-linha)}
.md-perigo-l>div:first-child{flex:1;min-width:220px}
.md-perigo-l b{display:block;font-size:.9rem;color:var(--ce)}.md-perigo-l span{font-size:.78rem;color:var(--cm)}

/* ═══════════════════════════════════════════════════════════════════════
   Painel da Educação Especial (Etapa 15, 21/09/2026) — aee.html?escola=<id>
   Modos (pela ocupação do professor na escola):
     mediador / assistente → uma aba para cada aluno acompanhado
     aee                   → "Alunos do AEE" com filtros + abas dos abertos
     regente (só)          → abre o perfil de um aluno vinculado (?aluno=)
   O aluno é compartilhado entre contas pelo CÓDIGO (tabelas aee_*): todos os
   profissionais vinculados veem o mesmo perfil, registros, boletim e
   documentos. Estrutura das escolas: professor_dados (meu-diario:estrutura:v1).
   ═══════════════════════════════════════════════════════════════════════ */
(function(){
  'use strict';
  var SCOPE='meu-diario:estrutura:v1';
  var P=new URLSearchParams(location.search), ESCOLA_ID=P.get('escola')||'', ALUNO_INICIAL=P.get('aluno')||'';
  var PAPEIS={mediador:'Professor mediador',assistente:'Assistente Educacional',aee:'Professor AEE',regente:'Professor regente'};
  var DEFICIENCIAS=['TEA (Transtorno do Espectro Autista)','Deficiência intelectual','Deficiência física','Deficiência auditiva / surdez','Deficiência visual / baixa visão','Cegueira','Surdocegueira','Deficiência múltipla','Síndrome de Down','Paralisia cerebral','TDAH','Transtornos de aprendizagem (dislexia, discalculia…)','Altas habilidades / superdotação','Outra'];
  var TIPOS={atendimento:'🧩 Atendimento AEE',diario:'📓 Acompanhamento',avaliacao:'📊 Avaliação',ocorrencia:'⚠️ Ocorrência',comunicado:'✉️ Família',relatorio:'📄 Relatório',nota:'🔢 Nota'};
  var PASTAS=['Laudos e saúde','Relatórios','PEI e planejamento','Atividades adaptadas','Avaliações','Família e comunicação','Outros'];
  var ST_PEI={nao_iniciada:'Não iniciada',em_andamento:'Em andamento',atingida:'Atingida',revisar:'Revisar'};
  var CAMPOS_PERFIL=[['comunicacao','Comunicação','Como o aluno se comunica (fala, gestos, prancha, Libras…)'],['necessidades','Necessidades de apoio','Em que precisa de ajuda na rotina e nas atividades'],['potencialidades','Potencialidades e interesses','O que faz bem, do que gosta, o que motiva'],['estrategias','Estratégias que funcionam','Adaptações, rotina visual, tempo extra, lugar na sala…'],['cuidados','Cuidados de saúde','Medicação, alergias, crises, restrições (só o necessário)'],['crise','Sinais de crise e como agir','Gatilhos, sinais de alerta e o que fazer'],['observacoes','Outras observações','']];

  var S,C,cli,usuario,E=null,syncE=null,carregado=false;

  var FILTRO={q:'',def:'',serie:'',prof:'',ordem:'nome'};

  function $(s,r){return (r||document).querySelector(s);}

  function hoje(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
  function dataBr(k){return k?String(k).slice(8,10)+'/'+String(k).slice(5,7)+'/'+String(k).slice(0,4):'';}

  function fotoHtml(a){return a.foto?'<img src="'+esc(a.foto)+'" alt="">':esc(C.iniciais(a.nome));}

  function meuPapel(id){var v=VINC.filter(function(x){return x.aluno_id===id;})[0];return v?v.papel:'';}
  function editor(id){return ['mediador','assistente','aee'].indexOf(meuPapel(id))>=0;}

  function carregarResumoAEE(){
    var ids=VINC.map(function(v){return v.aluno_id;});
    return Promise.all([
      cli.from('aee_vinculos').select('aluno_id,papel,nome_profissional,disciplina').in('aluno_id',ids),
      cli.from('aee_registros').select('aluno_id,data,tipo').in('aluno_id',ids).order('data',{ascending:false}).limit(2000)
    ]).then(function(rs){
      EQUIPE_TODOS={};ULTIMO_REG={};
      (rs[0].data||[]).forEach(function(v){(EQUIPE_TODOS[v.aluno_id]=EQUIPE_TODOS[v.aluno_id]||[]).push(v);});
      (rs[1].data||[]).forEach(function(r){var u=ULTIMO_REG[r.aluno_id]=ULTIMO_REG[r.aluno_id]||{data:r.data,n:0};u.n++;});
    });
  }
  function carregarDetalhe(id){
    return Promise.all([
      cli.from('aee_registros').select('*').eq('aluno_id',id).order('data',{ascending:false}).order('criado_em',{ascending:false}),
      cli.from('aee_documentos').select('*').eq('aluno_id',id).order('criado_em',{ascending:false}),
      cli.from('aee_vinculos').select('user_id,papel,nome_profissional,disciplina,criado_em').eq('aluno_id',id),
      cli.from('aee_alunos').select('*').eq('id',id).single()
    ]).then(function(rs){
      rs.forEach(function(r){if(r.error)throw new Error(r.error.message);});
      DET[id]={registros:rs[0].data||[],documentos:rs[1].data||[],equipe:rs[2].data||[]};
      var v=VINC.filter(function(x){return x.aluno_id===id;})[0];if(v)v.aee_alunos=rs[3].data;
      return DET[id];
    });
  }

  // ── Abas ────────────────────────────────────────────────────────────
  function abas(){
    var l=[];
    if(MODO==='aee'){
      l.push({id:'inicio',rotulo:'📋 Alunos do AEE'});
      ABERTOS.forEach(function(id){var a=aluno(id);if(a)l.push({id:'a-'+id,rotulo:'♿ '+nomeCurto(a.nome),fechar:id});});
    }else{
      if(MODO==='mediador'&&!VINC.length)l.push({id:'inicio',rotulo:'🏠 Início'});
      VINC.forEach(function(v){l.push({id:'a-'+v.aluno_id,rotulo:'♿ '+nomeCurto(v.aee_alunos.nome)});});
    }
    if(MODO!=='regente')l.push({id:'novo',rotulo:'＋ Aluno'});
    l.push({id:'ia',rotulo:'🤖 I.A'});
    if(MODO!=='regente')l.push({id:'config',rotulo:'⚙️ Configurações'});
    return l;
  }
  function desenharAbas(){
    var nav=$('#md-tabs');
    nav.innerHTML=abas().map(function(a,i){return (i?'<div class="sp"></div>':'')+'<button type="button" class="nb" data-aba="'+esc(a.id)+'">'+esc(a.rotulo)+(a.fechar?'<span class="x" data-fechar-aba="'+esc(a.fechar)+'" title="Fechar">✕</span>':'')+'</button>';}).join('');
    nav.querySelectorAll('.nb').forEach(function(b){b.onclick=function(ev){
      var x=ev.target.getAttribute('data-fechar-aba');
      if(x){ABERTOS=ABERTOS.filter(function(i){return i!==x;});var s=document.getElementById('sec-a-'+x);if(s)s.remove();desenharAbas();irPara('inicio');return;}
      irPara(b.getAttribute('data-aba'));
    };});
    nav.querySelectorAll('.nb').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-aba')===abaAtual);});
  }
  function irPara(id){
    if(id.indexOf('a-')===0){abrirAluno(id.slice(2));return;}
    if(!document.getElementById('sec-'+id))id=abas()[0].id;
    if(id.indexOf('a-')===0){abrirAluno(id.slice(2));return;}
    mostrar(id);
    if(id==='ia'){var m=iaModulo();if(m&&m.aoAbrir)m.aoAbrir('ia');}
  }
  function mostrar(id){
    abaAtual=id;
    document.querySelectorAll('#md-main>.sec').forEach(function(s){s.classList.toggle('on',s.id==='sec-'+id);});
    document.querySelectorAll('.nb[data-aba]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-aba')===id);});
    window.scrollTo(0,0);
  }

  // ── Início (mediador sem aluno) e painel do AEE ─────────────────────
  function desenharInicio(){
    var sec=$('#sec-inicio');
    if(MODO!=='aee'){
      sec.innerHTML='<div class="th"><div class="tb gz">♿</div><div class="ti"><h2>Olá'+(C.nomeExibicao()?', '+esc(C.nomeExibicao().split(' ')[0]):'')+'!</h2><p>'+esc(ESC.nome)+' · '+esc(C.ocupacao.rotulo(OCUP))+'</p></div></div>'
        +'<div class="md-card"><h3>Nenhum aluno ainda</h3><p>Aqui cada aluno que você acompanha ganha uma aba com o nome dele: perfil, disciplinas, boletim, registros de todos os professores, PEI, documentos e o relatório individual. Cadastre o aluno ou, se outro profissional já cadastrou, entre com o código dele.</p><div style="margin-top:12px"><button type="button" class="md-btn pri" data-ir="novo">＋ Cadastrar ou vincular aluno</button></div></div>';
      sec.querySelector('[data-ir]').onclick=function(){irPara('novo');};
      return;
    }
    var todos=VINC.map(function(v){return v.aee_alunos;});
    var series={},defs={},profs={};
    todos.forEach(function(a){if(a.serie||a.turma)series[[a.serie,a.turma].filter(Boolean).join(' · ')]=1;(a.deficiencias||[]).forEach(function(d){defs[d]=1;});(EQUIPE_TODOS[a.id]||[]).forEach(function(v){if(v.papel!=='regente'&&v.papel!=='aee')profs[v.nome_profissional||'']=1;});});
    var limite=new Date();limite.setDate(limite.getDate()-14);var limK=limite.toISOString().slice(0,10);
    var semReg=todos.filter(function(a){var u=ULTIMO_REG[a.id];return !u||u.data<limK;}).length;
    var q=FILTRO.q.toLowerCase();
    var lista=todos.filter(function(a){
      if(q&&(a.nome+' '+a.codigo).toLowerCase().indexOf(q)<0)return false;
      if(FILTRO.def&&(a.deficiencias||[]).indexOf(FILTRO.def)<0)return false;
      if(FILTRO.serie&&[a.serie,a.turma].filter(Boolean).join(' · ')!==FILTRO.serie)return false;
      if(FILTRO.prof&&!(EQUIPE_TODOS[a.id]||[]).some(function(v){return v.nome_profissional===FILTRO.prof;}))return false;
      return true;
    }).sort(function(a,b){
      if(FILTRO.ordem==='registro'){var x=(ULTIMO_REG[a.id]||{}).data||'',y=(ULTIMO_REG[b.id]||{}).data||'';return x.localeCompare(y);}
      if(FILTRO.ordem==='serie')return ([a.serie,a.turma].join()).localeCompare([b.serie,b.turma].join());
      return a.nome.localeCompare(b.nome);
    });
    var opt=function(o,sel){return Object.keys(o).filter(Boolean).sort().map(function(k){return '<option'+(k===sel?' selected':'')+'>'+esc(k)+'</option>';}).join('');};
    sec.innerHTML='<div class="th"><div class="tb gz">📋</div><div class="ti"><h2>Alunos do AEE</h2><p>'+esc(ESC.nome)+' · perfis ligados aos registros dos mediadores, assistentes e professores</p></div><button type="button" class="md-btn pri" data-ir="novo">＋ Aluno</button></div>'
      +'<div class="sr"><div class="sc2"><div class="n">'+todos.length+'</div><div class="l">Alunos</div></div><div class="sc2"><div class="n">'+Object.keys(defs).length+'</div><div class="l">Tipos de deficiência</div></div>'
      +'<div class="sc2"><div class="n">'+Object.keys(profs).length+'</div><div class="l">Mediadores e assistentes</div></div><div class="sc2 al"><div class="n">'+semReg+'</div><div class="l">Sem registro há 14 dias</div></div></div>'
      +'<div class="aee-filtros"><input class="md-in" data-f="q" placeholder="🔎 Nome ou código" value="'+esc(FILTRO.q)+'">'
      +'<select class="md-in" data-f="def"><option value="">Todas as deficiências</option>'+opt(defs,FILTRO.def)+'</select>'
      +'<select class="md-in" data-f="serie"><option value="">Todas as séries/turmas</option>'+opt(series,FILTRO.serie)+'</select>'
      +'<select class="md-in" data-f="prof"><option value="">Todos os mediadores/assistentes</option>'+opt(profs,FILTRO.prof)+'</select>'
      +'<select class="md-in" data-f="ordem"><option value="nome"'+(FILTRO.ordem==='nome'?' selected':'')+'>Ordem: nome</option><option value="serie"'+(FILTRO.ordem==='serie'?' selected':'')+'>Ordem: série</option><option value="registro"'+(FILTRO.ordem==='registro'?' selected':'')+'>Ordem: registro mais antigo</option></select></div>'
      +(lista.length?'<div class="aee-lista">'+lista.map(function(a){
        var u=ULTIMO_REG[a.id],eq=(EQUIPE_TODOS[a.id]||[]).filter(function(v){return v.papel==='mediador'||v.papel==='assistente';});
        var velho=!u||u.data<limK;
        return '<button type="button" class="aee-card" data-abrir="'+a.id+'"><div class="aee-foto">'+fotoHtml(a)+'</div><div style="min-width:0"><b>'+esc(a.nome)+'</b>'
          +'<small>'+esc([idadeDe(a),a.serie,a.turma,a.turno].filter(Boolean).join(' · '))+'</small>'
          +'<small>'+esc((a.deficiencias||[]).join(', ')||'—')+'</small>'
          +'<small>'+(eq.length?'👥 '+esc(eq.map(function(v){return v.nome_profissional;}).join(', ')):'Sem mediador ou assistente')+'</small>'
          +'<small class="'+(velho?'aee-alerta':'')+'">'+(u?'Último registro: '+dataBr(u.data)+' · '+u.n+' no total':'Nenhum registro ainda')+'</small></div></button>';
      }).join('')+'</div>':'<div class="md-card md-vazio">'+(todos.length?'Nenhum aluno com esses filtros.':'Nenhum aluno ainda. Cadastre ou vincule pelo código em <strong>＋ Aluno</strong>.')+'</div>');
    sec.querySelectorAll('[data-f]').forEach(function(el){el.addEventListener(el.tagName==='INPUT'?'input':'change',function(){FILTRO[el.getAttribute('data-f')]=el.value;var foco=el.tagName==='INPUT';desenharInicio();if(foco){var i=$('#sec-inicio [data-f="q"]');i.focus();i.setSelectionRange(i.value.length,i.value.length);}});});
    sec.querySelectorAll('[data-abrir]').forEach(function(b){b.onclick=function(){abrirAluno(b.getAttribute('data-abrir'));};});
    sec.querySelector('[data-ir]').onclick=function(){irPara('novo');};
  }

  // ── Aluno ───────────────────────────────────────────────────────────
  function abrirAluno(id){
    if(!aluno(id)){toast('Aluno não encontrado.');return;}
    if(MODO==='aee'&&ABERTOS.indexOf(id)<0){ABERTOS.push(id);desenharAbas();}
    var sec=document.getElementById('sec-a-'+id);
    if(!sec){sec=document.createElement('section');sec.className='sec';sec.id='sec-a-'+id;$('#md-main').insertBefore(sec,$('#sec-novo'));}
    mostrar('a-'+id);
    if(!DET[id])sec.innerHTML='<div class="md-card md-vazio">Carregando o perfil…</div>';
    else desenharAluno(id);
    carregarDetalhe(id).then(function(){desenharAluno(id);}).catch(function(e){toast('Não consegui carregar: '+e.message);});
  }
  function desenharAluno(id){
    var sec=document.getElementById('sec-a-'+id),a=aluno(id),d=DET[id];if(!sec||!a||!d)return;
    var sub=subAba[id]||'perfil',ed=editor(id);
    var SUBS=[['perfil','👤 Perfil'],['boletim','📚 Disciplinas e boletim'],['registros','📝 Registros'],['pei','🎯 PEI'],['docs','📁 Documentos'],['equipe','👥 Equipe'],['relatorio','📄 Relatório individual']];
    sec.innerHTML='<div class="aee-cab-aluno"><div class="aee-foto">'+fotoHtml(a)+'</div><div style="flex:1;min-width:220px"><h2>'+esc(a.nome)+'</h2>'
      +'<div class="aee-meta">'+esc([idadeDe(a),a.serie,a.turma?'Turma '+a.turma:'',a.turno,a.escola_nome].filter(Boolean).join(' · '))+'</div>'
      +'<div class="aee-chips">'+(a.deficiencias||[]).map(function(x){return '<span class="aee-chip">'+esc(x)+'</span>';}).join('')+(a.cid?'<span class="aee-chip cid">CID '+esc(a.cid)+'</span>':'')+(a.laudo?'<span class="aee-chip cid">Com laudo</span>':'')+'</div></div>'
      +'<div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end"><span class="aee-cod" data-copiar title="Copiar o código">🔑 '+esc(a.codigo)+' <small>copiar</small></span><span style="font-size:.74rem;color:var(--cm)">Você: '+esc(PAPEIS[meuPapel(id)]||'')+'</span></div></div>'
      +'<div class="aee-sub">'+SUBS.map(function(s){return '<button type="button" data-sub="'+s[0]+'" class="'+(s[0]===sub?'on':'')+'">'+s[1]+'</button>';}).join('')+'</div>'
      +'<div data-corpo></div>';
    sec.querySelector('[data-copiar]').onclick=function(){try{navigator.clipboard.writeText(a.codigo);toast('Código copiado: '+a.codigo);}catch(e){toast(a.codigo);}};
    sec.querySelectorAll('[data-sub]').forEach(function(b){b.onclick=function(){subAba[id]=b.getAttribute('data-sub');desenharAluno(id);};});
    var corpo=sec.querySelector('[data-corpo]');
    ({perfil:subPerfil,boletim:subBoletim,registros:subRegistros,pei:subPei,docs:subDocs,equipe:subEquipe,relatorio:subRelatorio})[sub](corpo,a,d,ed,id);
  }

  // Perfil
  function subPerfil(box,a,d,ed,id){
    var p=a.perfil||{};
    var resp=(p.responsaveis||[]).filter(function(r){return r.nome;});
    box.innerHTML='<div class="aee-aviso">🔒 Estes dados são sensíveis (LGPD): só os profissionais vinculados a '+esc(a.nome.split(' ')[0])+' veem. Registre apenas o necessário para o trabalho pedagógico.</div>'
      +'<div class="md-card"><div class="th" style="margin-bottom:12px;padding-bottom:10px"><div class="ti"><h2 style="font-size:1.1rem">Dados do aluno</h2></div>'+(ed?'<button type="button" class="md-btn pri" data-editar>✏️ Editar perfil</button>':'')+'</div>'
      +'<div class="aee-2col">'
      +bloco('Nascimento',a.nascimento?dataBr(a.nascimento)+' ('+idadeDe(a)+')':'')+bloco('Escola',[a.escola_nome,a.municipio&&a.municipio+'/'+(a.uf||'')].filter(Boolean).join(' · '))
      +bloco('Série / turma / turno',[a.serie,a.turma,a.turno].filter(Boolean).join(' · '))+bloco('Deficiência(s)',(a.deficiencias||[]).join(', ')+(p.deficienciaOutra?' — '+p.deficienciaOutra:''))
      +bloco('CID e laudo',[a.cid?'CID '+a.cid:'',a.laudo===true?'Tem laudo':a.laudo===false?'Sem laudo':'',p.laudoObs||''].filter(Boolean).join(' · '))
      +bloco('Responsáveis',resp.map(function(r){return r.nome+(r.parentesco?' ('+r.parentesco+')':'')+(r.telefone?' · '+r.telefone:'');}).join('\n'))
      +'</div></div>'
      +'<div class="md-card"><div class="aee-2col">'+CAMPOS_PERFIL.map(function(c){return bloco(c[1],p[c[0]]);}).join('')+'</div></div>'
      +'<p style="font-size:.76rem;color:var(--cm)">Atualizado em '+new Date(a.atualizado_em).toLocaleString('pt-BR')+(a.atualizado_por?' por '+esc(a.atualizado_por):'')+'.</p>';
    var b=box.querySelector('[data-editar]');if(b)b.onclick=function(){formAluno(a);};
  }
  function bloco(t,v){return '<div class="aee-bloco"><h4>'+esc(t)+'</h4><p class="'+(v?'':'vazio')+'">'+esc(v||'Não informado')+'</p></div>';}

  // Disciplinas e boletim
  function disciplinasDe(a,d){
    var m={};
    ((a.perfil||{}).disciplinas||[]).forEach(function(x){if(x.nome)m[x.nome]={nome:x.nome,professor:x.professor||''};});
    d.equipe.forEach(function(v){if(v.papel==='regente'&&v.disciplina){m[v.disciplina]=m[v.disciplina]||{nome:v.disciplina,professor:''};if(!m[v.disciplina].professor)m[v.disciplina].professor=v.nome_profissional||'';}});
    d.registros.forEach(function(r){if(r.disciplina&&!m[r.disciplina])m[r.disciplina]={nome:r.disciplina,professor:''};});
    return Object.keys(m).sort().map(function(k){return m[k];});
  }
  function boletimDe(d){
    var b={};
    d.registros.filter(function(r){return r.tipo==='nota'&&r.disciplina&&r.bimestre&&r.nota!==null;}).slice().reverse().forEach(function(r){(b[r.disciplina]=b[r.disciplina]||{})[r.bimestre]=r;});
    return b;
  }
  function subBoletim(box,a,d,ed,id){
    var ds=disciplinasDe(a,d),bol=boletimDe(d);
    var linhas=ds.map(function(x){
      var n=[1,2,3,4].map(function(k){return bol[x.nome]&&bol[x.nome][k]?Number(bol[x.nome][k].nota):null;});
      var val=n.filter(function(v){return v!==null;}),med=val.length?val.reduce(function(s,v){return s+v;},0)/val.length:null;
      return '<tr><td><b>'+esc(x.nome)+'</b>'+(x.professor?'<br><span style="font-size:.74rem;color:var(--cm)">'+esc(x.professor)+'</span>':'')+'</td>'
        +n.map(function(v){return '<td class="n">'+(v===null?'—':'<span class="'+(v>=7?'nota-b':v<5?'nota-r':'')+'">'+v.toFixed(1).replace('.',',')+'</span>')+'</td>';}).join('')
        +'<td class="n"><b>'+(med===null?'—':med.toFixed(1).replace('.',','))+'</b></td></tr>';
    }).join('');
    box.innerHTML='<div class="md-card"><div class="th" style="margin-bottom:12px;padding-bottom:10px"><div class="ti"><h2 style="font-size:1.1rem">Boletim</h2><p>Notas lançadas por cada professor no perfil do aluno (a mais recente de cada bimestre vale).</p></div><button type="button" class="md-btn pri" data-nota>＋ Lançar nota</button></div>'
      +(ds.length?'<div style="overflow-x:auto"><table class="aee-tab"><tr><th>Disciplina</th><th class="n">1º</th><th class="n">2º</th><th class="n">3º</th><th class="n">4º</th><th class="n">Média</th></tr>'+linhas+'</table></div>':'<p>Nenhuma disciplina ainda. '+(ed?'Cadastre as disciplinas em ✏️ Editar perfil, ou':'')+' lance uma nota.</p>')+'</div>'
      +'<div class="md-card"><h3>Disciplinas que '+esc(a.nome.split(' ')[0])+' estuda</h3>'+(ds.length?'<table class="aee-tab"><tr><th>Disciplina</th><th>Professor(a)</th><th class="n">Registros</th></tr>'+ds.map(function(x){return '<tr><td>'+esc(x.nome)+'</td><td>'+esc(x.professor||'—')+'</td><td class="n">'+d.registros.filter(function(r){return r.disciplina===x.nome;}).length+'</td></tr>';}).join('')+'</table>':'<p>—</p>')
      +'<p style="font-size:.78rem;color:var(--cm);margin-top:10px">Cada professor regente entra com o código <b>'+esc(a.codigo)+'</b> (Configurações da escola › Alunos da Educação Especial) e lança notas e registros da própria disciplina.</p></div>';
    box.querySelector('[data-nota]').onclick=function(){formRegistro(id,{tipo:'nota'});};
  }

  // Registros
  function subRegistros(box,a,d,ed,id){
    var F=subAba['f-'+id]||{tipo:'',disc:'',autor:''};
    var discs={},autores={};d.registros.forEach(function(r){if(r.disciplina)discs[r.disciplina]=1;if(r.autor)autores[r.autor]=1;});
    var l=d.registros.filter(function(r){return (!F.tipo||r.tipo===F.tipo)&&(!F.disc||r.disciplina===F.disc)&&(!F.autor||r.autor===F.autor);});
    var opt=function(o,sel){return Object.keys(o).sort().map(function(k){return '<option'+(k===sel?' selected':'')+'>'+esc(k)+'</option>';}).join('');};
    box.innerHTML='<div class="md-acoes" style="margin:0 0 12px"><button type="button" class="md-btn pri" data-novo>＋ Novo registro</button><button type="button" class="md-btn" data-ia>🤖 Escrever com a I.A</button></div>'
      +'<div class="aee-filtros"><select class="md-in" data-rf="tipo"><option value="">Todos os tipos</option>'+Object.keys(TIPOS).map(function(k){return '<option value="'+k+'"'+(k===F.tipo?' selected':'')+'>'+TIPOS[k]+'</option>';}).join('')+'</select>'
      +'<select class="md-in" data-rf="disc"><option value="">Todas as disciplinas</option>'+opt(discs,F.disc)+'</select>'
      +'<select class="md-in" data-rf="autor"><option value="">Todos os profissionais</option>'+opt(autores,F.autor)+'</select></div>'
      +(l.length?l.map(function(r){
        var meu=r.user_id===usuario.id;
        return '<div class="aee-reg '+r.tipo+'"><div class="top"><b>'+esc(TIPOS[r.tipo]||r.tipo)+'</b><span>'+dataBr(r.data)+'</span>'+(r.disciplina?'<span>· '+esc(r.disciplina)+'</span>':'')+(r.tipo==='nota'?'<span>· '+r.bimestre+'º bim · nota '+String(r.nota).replace('.',',')+'</span>':'')
          +'<span>· '+esc(r.autor||'')+' ('+esc(PAPEIS[r.papel]||r.papel||'')+')</span>'+(meu?'<span class="ac"><button type="button" class="md-btn mini" data-ed="'+r.id+'">Editar</button><button type="button" class="md-btn mini perigo" data-rm="'+r.id+'">Excluir</button></span>':'')+'</div>'
          +(r.titulo?'<div style="font-weight:700;margin-top:6px">'+esc(r.titulo)+'</div>':'')+(r.texto?'<div class="tx">'+esc(r.texto)+'</div>':'')+'</div>';
      }).join(''):'<div class="md-card md-vazio">Nenhum registro'+(F.tipo||F.disc||F.autor?' com esses filtros':' ainda')+'.</div>');
    box.querySelectorAll('[data-rf]').forEach(function(s){s.onchange=function(){F[s.getAttribute('data-rf')]=s.value;subAba['f-'+id]=F;desenharAluno(id);};});

      cli.storage.from('aee-arquivos').createSignedUrl(x.caminho,300).then(function(r){if(r.error){if(j)j.close();return toast(r.error.message);}if(j)j.location.href=r.data.signedUrl;else location.href=r.data.signedUrl;});
    };});

        cli.storage.from('aee-arquivos').remove([x.caminho]).then(function(){return cli.from('aee_documentos').delete().eq('id',x.id);}).then(function(r){

  function enviarDocs(id,pasta,arqs){
    var l=[].slice.call(arqs||[]);if(!l.length)return;
    var grandes=l.filter(function(f){return f.size>15728640;});if(grandes.length)return toast('Acima de 15 MB: '+grandes.map(function(f){return f.name;}).join(', '));
    toast('Enviando '+l.length+' arquivo(s)…');
    l.reduce(function(p,f){return p.then(function(){
      var limpo=f.name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.-]+/g,'_').slice(-80);
      var cam=id+'/'+pasta.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w]+/g,'-').toLowerCase()+'/'+Date.now()+'-'+limpo;
      return cli.storage.from('aee-arquivos').upload(cam,f,{contentType:f.type||'application/octet-stream'}).then(function(r){
        if(r.error)throw new Error(f.name+': '+r.error.message);
        return cli.from('aee_documentos').insert({aluno_id:id,pasta:pasta,nome:f.name,caminho:cam,tipo:f.type,tamanho:f.size,user_id:usuario.id,autor:perfilNome()});
      }).then(function(r){if(r&&r.error)throw new Error(r.error.message);});
    });},Promise.resolve()).then(function(){toast('Enviado.');}).catch(function(e){toast('Falha: '+e.message);})
      .then(function(){carregarDetalhe(id).then(function(){desenharAluno(id);});});
  }

        var ps=function(t){return F.pseudonimizar(t);};
        var dados=VINC.map(function(v,i){
          var a=v.aee_alunos,p=a.perfil||{},d=DET[a.id],o={codigo:'«T1.'+(i+1)+'»',idade:idadeDe(a),serie:a.serie,turma:a.turma,deficiencias:a.deficiencias,meu_papel:PAPEIS[v.papel]};
          if(!F.ocultarNomes())o.nome=a.nome;
          CAMPOS_PERFIL.forEach(function(c){if(p[c[0]])o[c[0]]=ps(String(p[c[0]]).slice(0,600));});
          o.disciplinas=(p.disciplinas||[]).map(function(x){return x.nome;});
          o.pei={objetivo:ps((p.pei||{}).objetivo||''),metas:((p.pei||{}).metas||[]).map(function(m,k){return{n:k+1,meta:ps(m.meta),area:m.area,situacao:ST_PEI[m.status||'nao_iniciada']};})};
          if(d)o.registros_recentes=d.registros.slice(0,15).map(function(r){return{data:r.data,tipo:r.tipo,disciplina:r.disciplina,autor_papel:PAPEIS[r.papel],nota:r.tipo==='nota'?r.nota:undefined,bimestre:r.bimestre||undefined,texto:ps(String((r.titulo?r.titulo+'. ':'')+(r.texto||'')).slice(0,500))};});
          else o.registros_recentes='(abra a aba do aluno para carregar os registros)';
          return o;
        });
        return [
          'Você é o assistente de I.A '+M.nomePlataforma+' do RELATORIO SKIN, trabalhando com '+perfilNome()+' ('+C.ocupacao.rotulo(OCUP)+') na escola '+ESC.nome+'. Responda sempre em português do Brasil.',
          'HOJE: '+F.hoje()+'.',
          '',
          'ESPECIALIDADE',
          '- Educação inclusiva e Atendimento Educacional Especializado (AEE): PEI, adaptação curricular e de atividades, acessibilidade, comunicação alternativa, rotina e previsibilidade, manejo de crises, relatórios descritivos e parceria com a família.',
          '- Base: Política Nacional de Educação Especial na Perspectiva da Educação Inclusiva, LBI (Lei 13.146/2015), BNCC e Desenho Universal para a Aprendizagem.',
          '- Foque nas potencialidades e nas barreiras do ambiente, não na "falta". Use linguagem respeitosa e não capacitista (ex.: "aluno com deficiência", "estudante autista" quando a família usa).',
          '- Nunca faça diagnóstico, nunca sugira medicação nem mude condutas de saúde: oriente a buscar a família e os profissionais de saúde.',
          '- Registros e relatórios: descritivos, objetivos, com fatos observados (o que fez, com qual apoio, como respondeu) e próximos passos. Sem julgamentos.',
          '- Seja prático: estratégias concretas que caibam na sala de aula real.',
          '',
          'REGRAS',
          '- Use só os DADOS e o que o professor informar. Não invente fatos, notas ou registros.',
          F.ocultarNomes()?'- Os nomes estão ocultos: cada aluno aparece como «T1.n». Use esses códigos no texto.':'- Pode usar o nome do aluno.',
          '- Dados de saúde e deficiência são sensíveis: mencione só o necessário.',
          '',
          'COMO PROPOR AÇÕES',
          'No FINAL da resposta, e só quando houver algo para gravar, um único bloco:',
          '```acoes','[{"tipo":"...", ...}]','```',
          'O professor confirma cada ação antes de gravar.',
          '',
          'TIPOS DE AÇÃO',
          '1. registro_aee — grava um registro no perfil do aluno: {"tipo":"registro_aee","aluno":"«T1.1»","categoria":"diario|atendimento|avaliacao|ocorrencia|comunicado|relatorio","data":"AAAA-MM-DD","disciplina":"(opcional)","titulo":"resumo curto","texto":"registro completo"}',
          '2. meta_pei — acrescenta uma meta ao PEI (só mediador, assistente ou AEE): {"tipo":"meta_pei","aluno":"«T1.1»","meta":"","area":"Comunicação|Leitura e escrita|Matemática|Autonomia|Socialização|Comportamento|Motora|Atenção e memória","estrategias":"","criterio":"como avaliar","prazo":"AAAA-MM-DD"}',
          '3. atualizar_perfil_aee — atualiza um campo de texto do perfil (só mediador, assistente ou AEE): {"tipo":"atualizar_perfil_aee","aluno":"«T1.1»","campo":"comunicacao|necessidades|potencialidades|estrategias|cuidados|crise|observacoes","texto":"novo texto completo do campo"}',
          '',
          'DADOS DOS ALUNOS (JSON):',
          JSON.stringify({escola:ESC.nome,alunos:dados})
        ].join('\n');
      },
      aplicarAcao:function(a,F){
        if(['registro_aee','meta_pei','atualizar_perfil_aee'].indexOf(a.tipo)<0)return undefined;
        var v=alunoDaAcao(a.aluno),id=v.aluno_id,al=v.aee_alunos;
        if(a.tipo==='registro_aee'){
          var cat=TIPOS[a.categoria]&&a.categoria!=='nota'?a.categoria:'diario';
          return salvarRegistro(id,{tipo:cat,data:/^\d{4}-\d{2}-\d{2}$/.test(a.data||'')?a.data:hoje(),disciplina:a.disciplina||null,titulo:F.restaurar(a.titulo||'',true)||null,texto:F.restaurar(a.texto||'',true)||null}).then(function(ok){if(!ok)throw new Error('Não consegui salvar o registro.');return 'Registro gravado no perfil de '+al.nome+'.';});
        }
        if(!editor(id))throw new Error('Só mediador, assistente ou AEE alteram o perfil e o PEI.');
        if(a.tipo==='meta_pei'){
          var pei=JSON.parse(JSON.stringify((al.perfil||{}).pei||{metas:[]}));pei.metas=pei.metas||[];
          pei.metas.push({id:'m'+Date.now().toString(36)+pei.metas.length,meta:F.restaurar(a.meta||'',true),area:a.area||'',estrategias:F.restaurar(a.estrategias||'',true),criterio:F.restaurar(a.criterio||'',true),prazo:/^\d{4}-\d{2}-\d{2}$/.test(a.prazo||'')?a.prazo:'',status:'nao_iniciada'});
          var perfil=Object.assign({},al.perfil||{});pei.revisadoEm=hoje();perfil.pei=pei;
          return atualizarAluno(id,{perfil:perfil}).then(function(ok){if(!ok)throw new Error('Não consegui salvar a meta.');if(DET[id])desenharAluno(id);return 'Meta acrescentada ao PEI de '+al.nome+'.';});
        }
        var campos=CAMPOS_PERFIL.map(function(c){return c[0];});
        if(campos.indexOf(a.campo)<0)throw new Error('Campo do perfil desconhecido: '+a.campo+'.');
        var pf=Object.assign({},al.perfil||{});pf[a.campo]=F.restaurar(a.texto||'',true);
        return atualizarAluno(id,{perfil:pf}).then(function(ok){if(!ok)throw new Error('Não consegui atualizar o perfil.');if(DET[id])desenharAluno(id);return 'Perfil de '+al.nome+' atualizado ('+a.campo+').';});
      },
      descreverAcao:function(a,F){
        var nome=function(){try{return alunoDaAcao(a.aluno).aee_alunos.nome;}catch(e){return a.aluno;}};
        if(a.tipo==='registro_aee')return{ic:'📝',t:'Registro ('+(TIPOS[a.categoria]||a.categoria||'acompanhamento')+') — '+nome(),d:F.restaurar(a.titulo||String(a.texto||'').slice(0,90))};
        if(a.tipo==='meta_pei')return{ic:'🎯',t:'Meta do PEI — '+nome(),d:F.restaurar(a.meta||'')};
        if(a.tipo==='atualizar_perfil_aee')return{ic:'👤',t:'Atualizar perfil ('+a.campo+') — '+nome(),d:F.restaurar(String(a.texto||'').slice(0,100))};
        return null;
      }
    };
    return M;
  }

  // ── Início da página ────────────────────────────────────────────────
  function desenharCabecalho(){
    $('#md-titulo').textContent=MODO==='aee'?'Painel do AEE':MODO==='mediador'?'Mediação e apoio':'Educação Especial';
    $('#md-escolas').textContent=ESC.nome+(ESC.inep?' · INEP '+ESC.inep.codigo:'');
    var av=$('#md-avatar');if(ESC.imagem)av.innerHTML='<img src="'+esc(ESC.imagem)+'" alt="">';else av.textContent=ESC.icone||'♿';
    $('#md-rodape').textContent=ESC.nome+' · '+(C.nomeExibicao()?C.nomeExibicao()+' · ':'')+'Educação Especial';
    document.title=(MODO==='aee'?'Painel AEE':'Educação Especial')+' — '+ESC.nome;
    var pn=$('#md-painel');
    C.ocupacao.botaoPainel(pn,ESC,'aee');
  }
  function iniciar(){
    S=window.RelatorioSupabaseSync;C=window.ContaSkin;cli=S.getClient();usuario=S.auth.currentUser();
    if(!ESCOLA_ID){location.replace('escolas.html');return;}
    C.perfil.iniciar();C.chip($('#md-chip'));
    E=lerLocal();
    syncE=S.createScopeSync({perUser:true,scope:SCOPE,source:'aee',debounceMs:250,getLocalPayload:function(){return E;},
      onRemotePayload:function(p){if(!p||!Array.isArray(p.turmas))return;if(String(p.atualizadoEm||'')<String(E.atualizadoEm||'')){syncE.schedulePush('local-mais-novo');return;}E=p;try{localStorage.setItem(lsKey(),JSON.stringify(E));}catch(x){}}});
    syncE.start().then(function(){
      carregado=true;
      if(!resolverEscola()){location.replace('escolas.html');return;}
      if(!OCUP.length){
        return C.ocupacao.escolher(ESC.nome,[]).then(function(l){if(!l){location.replace('escolas.html');return;}ESC.ocupacoes=OCUP=l;return salvarE().then(comecar);});
      }
      comecar();
    });
  }
  function comecar(){
    definirModo();
    if(MODO==='regente'&&!ALUNO_INICIAL){location.replace(C.ocupacao.destino(ESC,ESC.fixa));return;}
    desenharCabecalho();
    carregarVinculos().then(function(){
      desenharAbas();desenharInicio();desenharNovo();desenharConfig();
      var m=iaModulo();if(m){m.iniciar(apiIA());m.desenhar();}
      var alvo=ALUNO_INICIAL&&aluno(ALUNO_INICIAL)?ALUNO_INICIAL:(MODO==='mediador'&&VINC.length?VINC[0].aluno_id:'');
      if(alvo)abrirAluno(alvo);else irPara(MODO==='regente'?'ia':'inicio');
      if(MODO==='regente'&&ALUNO_INICIAL&&!aluno(ALUNO_INICIAL))toast('Você não está vinculado a este aluno.');
    }).catch(function(e){$('#sec-inicio').innerHTML='<div class="md-card md-vazio">Não consegui carregar: '+esc(e.message)+'</div>';});
    document.addEventListener('visibilitychange',function(){
      if(document.visibilityState!=='visible')return;
      var id=abaAtual.indexOf('a-')===0?abaAtual.slice(2):'';
      if(id)carregarDetalhe(id).then(function(){desenharAluno(id);}).catch(function(){});
    });
  }
  function quandoPronto(){
    if(!window.RelatorioSupabaseSync||!window.ContaSkin){setTimeout(quandoPronto,50);return;}
    window.RelatorioSupabaseSync.auth.whenAuthorized().then(function(){if(!usuario)iniciar();});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',quandoPronto);else quandoPronto();
})();
</script>

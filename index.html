<title>Relatórios 2026</title> <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background: #0b1e12;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 32px;
  padding: 20px;
  font-family: "Segoe UI", Tahoma, sans-serif;
}

a {
  display: block;
  border-radius: 24px;
  overflow: hidden;
  flex-shrink: 0;
  transition: transform .22s cubic-bezier(.34,1.4,.64,1), box-shadow .22s ease;
}

a:hover {
  transform: scale(1.04);
  box-shadow: 0 28px 64px rgba(0,0,0,.6);
}

.projetos-pessoais {
  width: 82vw;
  height: 82vw;
  max-width: 340px;
  max-height: 340px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  background: transparent;
  box-shadow: none;
}

.projetos-pessoais .pp-button-icon {
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  filter: none;
}

.projetos-pessoais > :not(.pp-button-icon) { display: none; }

a:not(.projetos-pessoais) > img {
  width: 82vw;
  height: 82vw;
  max-width: 340px;
  max-height: 340px;
  object-fit: contain;
  display: block;
}

@media (min-width: 900px) {
  body { flex-direction: row; flex-wrap: wrap; gap: 60px; padding: 24px; }
  a:not(.projetos-pessoais) > img, .projetos-pessoais { width: 320px; height: 320px; max-width: none; max-height: none; }
  a:hover { transform: translateY(-8px) scale(1.05); }
}
</style>
</head>
<body>

<a href="casavequia.html">
  <img src="botao-casavequia.png" alt="Pe. Carlos Casavequia">
</a>

<a class="h2" href="herminio.html">

</a>

<a class="projetos-pessoais" href="projetos-pessoais.html" aria-label="Abrir Projetos pessoais">
  <img class="pp-button-icon" src="botão_projetos.png" alt="">
  <span class="pp-icon">✦</span>
  <strong>Projetos<br>pessoais</strong>
  <span>Ideias, projetos, ferramentas e I.As em um só lugar.</span>
</a>

<title>Relatórios 2026</title> <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background: #0b1e12;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 32px;
  padding: 20px;
  font-family: "Segoe UI", Tahoma, sans-serif;
}

a {
  display: block;
  border-radius: 24px;
  overflow: hidden;
  flex-shrink: 0;
  transition: transform .22s cubic-bezier(.34,1.4,.64,1), box-shadow .22s ease;
}

a:hover {
  transform: scale(1.04);
  box-shadow: 0 28px 64px rgba(0,0,0,.6);
}

.projetos-pessoais {
  width: 82vw;
  height: 82vw;
  max-width: 340px;
  max-height: 340px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  background: transparent;
  box-shadow: none;
}

.projetos-pessoais .pp-button-icon {
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  filter: none;
}

.projetos-pessoais > :not(.pp-button-icon) { display: none; }

a:not(.projetos-pessoais) > img {
  width: 82vw;
  height: 82vw;
  max-width: 340px;
  max-height: 340px;
  object-fit: contain;
  display: block;
}

@media (min-width: 900px) {
  body { flex-direction: row; flex-wrap: wrap; gap: 60px; padding: 24px; }
  a:not(.projetos-pessoais) > img, .projetos-pessoais { width: 320px; height: 320px; max-width: none; max-height: none; }
  a:hover { transform: translateY(-8px) scale(1.05); }
}
.conta-barra { position: fixed; top: 12px; right: 12px; display: flex; gap: 8px; align-items: center; z-index: 10;
  font-size: .78rem; color: #a9c4b2; }
.conta-barra button { background: rgba(255,255,255,.08); color: #e9f3ec; border: 1px solid rgba(255,255,255,.2);
  border-radius: 999px; padding: 6px 12px; font-weight: 700; cursor: pointer; }
/* Rodapé da marca: linha própria, depois dos botões das escolas. */
.marca { flex-basis: 100%; order: 99; display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 8px; text-align: center; }
.marca a { border-radius: 0; overflow: visible; }
.marca a:hover { transform: none; box-shadow: none; }
.marca .marca-logo > img { width: 190px; height: auto; max-width: none; max-height: none; opacity: .92; transition: opacity .2s, transform .2s; }
.marca .marca-logo:hover > img { opacity: 1; transform: scale(1.03); }
.marca-prop { font-size: .66rem; letter-spacing: .22em; font-weight: 700; color: #8fb4d9; }
.legal { font-size: .7rem; color: #6f8a78; opacity: .75; }
.legal a { display: inline; color: inherit; text-decoration: none; }
.legal a:hover { text-decoration: underline; }
.legal:hover { opacity: 1; }
@media (min-width: 900px) { .marca { margin-top: -20px; } }
</style>

<div class="conta-barra" id="conta-barra" hidden><span id="conta-email"></span><button type="button" id="conta-sair">Sair</button></div>
<script>
// Tela inicial (Etapa 9): as escolas são da conta do administrador; qualquer
// outra conta segue para o Meu Diário, com os próprios dados.
document.addEventListener('DOMContentLoaded', function () {
  var S = window.RelatorioSupabaseSync;
  if (!S) return;
  S.auth.whenAuthorized().then(function () {
    if (!S.auth.isAdmin()) { window.location.replace(window.RELATORIO_SUPABASE_CONFIG.professorHome); return; }
    var barra = document.getElementById('conta-barra');
    document.getElementById('conta-email').textContent = (S.auth.currentUser() || {}).email || '';
    document.getElementById('conta-sair').onclick = function () { if (confirm('Sair da conta neste aparelho?')) S.auth.signOut(); };
    barra.hidden = false;
  });
});
</script>

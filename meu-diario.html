<title>Meu Diário</title>
<script>
window.NOVO_DIARIO_MANUAL = true;
// Tema escolhido antes do primeiro desenho (evita piscar claro→escuro).
(function(){var m='';try{m=localStorage.getItem('modo-tema')||'';}catch(e){}
  if(!m)m=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'escuro':'claro';
  window.MD_TEMA_INICIAL=m;
  if(m==='escuro')document.documentElement.classList.add('dark-2026');})();
</script>

<style>
:root{--vd:#1a3a2a;--vm:#2d6147;--vc:#4a9467;--vs:#c8e6d4;--ou:#c9a84c;--os:#f5e6be;--cr:#faf8f2;--ce:#2b2b2b;--cm:#5a5a5a;--cl:#e8e5de;--ra:#c0392b;--rs:#fdecea;--ai:#2980b9;--og:#876020;--card:#fff;--ss:0 4px 24px rgba(26,58,42,.10);--sc:0 2px 12px rgba(26,58,42,.08);--r:14px;--rs2:8px;
  /* Tokens próprios do Meu Diário (redefinidos no modo escuro). */
  --md-sup:#fff;--md-sup2:#faf8f2;--md-sup3:#f5f3ee;--md-linha:#e8e5de;--md-titulo:#1a3a2a;--md-acento:#2d6147;--md-acento-txt:#fff;--md-destaque:#2d6147;--md-fundo:#faf8f2}
html.dark-2026{--md-sup:#191c1f;--md-sup2:#202327;--md-sup3:#272b30;--md-linha:#383d43;--md-titulo:#f4f5f6;--md-acento:#ffa65b;--md-acento-txt:#1b130b;--md-destaque:#ffa65b;--md-fundo:#111315}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--md-fundo);color:var(--ce);min-height:100vh}
button{font-family:inherit}
a{color:var(--md-destaque)}
/* ── Cabeçalho e abas (mesmo desenho da Casavequia) ── */
.cab{background:linear-gradient(135deg,var(--vd),var(--vm) 60%,var(--vc));color:#fff;position:relative;overflow:hidden}
.cab::before{content:'';position:absolute;top:-60px;right:-60px;width:260px;height:260px;border-radius:50%;background:rgba(201,168,76,.15)}
.cab-i{max-width:1200px;margin:0 auto;padding:14px 40px 24px;position:relative;z-index:1;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.md-avatar{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(201,168,76,.7);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:1.7rem;font-weight:700;color:#f5e6be;flex-shrink:0;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.cab-t{flex:1;min-width:220px}
.cab-t h1{font-family:'Playfair Display',serif;font-size:1.7rem;font-weight:700;line-height:1.2}
.cab-t .sub{font-size:.8rem;opacity:.82;margin-top:4px;font-weight:300;letter-spacing:.04em;text-transform:uppercase}
.cab-t .prof{margin-top:9px;display:inline-flex;align-items:center;gap:7px;background:rgba(201,168,76,.25);border:1px solid rgba(201,168,76,.5);border-radius:20px;padding:4px 13px;font-size:.8rem;font-weight:500;color:var(--os);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cab-barra{max-width:1200px;margin:0 auto;padding:14px 40px 0;position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px}
@media(max-width:760px){.cab-barra{padding:12px 16px 0}}
.md-cab-acoes{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.md-sync{font-size:.74rem;background:rgba(255,255,255,.14);border-radius:999px;padding:6px 12px;white-space:nowrap}
.md-sair{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.8rem;cursor:pointer}
.md-voltar{text-decoration:none;white-space:nowrap}
.md-avatar{overflow:hidden}.md-avatar img{width:100%;height:100%;object-fit:cover;display:block}
#modo-btns{display:flex;gap:6px}
#modo-btns button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#modo-btns .btn-claro{background:#fff;border-color:#e8e5de;color:#c9a84c}
#modo-btns .btn-escuro{background:#1a3a2a;border-color:#4a9467;color:#c9a84c}
#modo-btns button.ativo{transform:scale(1.12);box-shadow:0 4px 14px rgba(0,0,0,.35);border-color:#c9a84c}
.nav-w{background:var(--vd);border-bottom:3px solid var(--ou);position:sticky;top:0;z-index:100}
.nav-i{max-width:1200px;margin:0 auto;display:flex;align-items:center;padding:0 40px;overflow-x:auto;scrollbar-width:none}
.nav-i::-webkit-scrollbar{display:none}
.nb{padding:12px 15px;background:transparent;border:none;color:rgba(255,255,255,.6);font-size:.8rem;font-weight:500;cursor:pointer;transition:all .2s;position:relative;white-space:nowrap;flex-shrink:0}
.nb:hover{color:#fff}.nb.on{color:var(--ou);font-weight:700}
.nb.on::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--ou);margin-bottom:-3px}
.sp{width:1px;height:16px;background:rgba(255,255,255,.15);flex-shrink:0;margin:0 1px}
.main{max-width:1200px;margin:0 auto;padding:30px 40px 60px}
.sec{display:none;animation:fi .3s ease}.sec.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.th{display:flex;align-items:center;gap:15px;margin-bottom:22px;padding-bottom:14px;border-bottom:2px solid var(--md-linha);flex-wrap:wrap}
.tb{background:var(--vm);color:#fff;font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;padding:9px 15px;border-radius:var(--rs2);line-height:1;flex-shrink:0}
.tb.gz{background:#444}.tb.ou{background:linear-gradient(135deg,#c9a84c,#e8c86a)}.tb.mr{background:linear-gradient(135deg,#8c6a2a,#d8b45b)}.tb.az{background:#1a5276}.tb.ia{background:linear-gradient(135deg,#1a1a2e,#2d3a6e)}
.ti{flex:1;min-width:200px}
.ti h2{font-family:'Playfair Display',serif;font-size:1.25rem;color:var(--md-titulo)}
.ti p{font-size:.82rem;color:var(--cm);margin-top:2px}
.md-acoes{display:flex;gap:10px;flex-wrap:wrap;margin:-8px 0 20px}
.sr{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:13px;margin-bottom:24px}
.sc2{background:var(--md-sup);border-radius:var(--rs2);padding:15px 17px;box-shadow:var(--sc);border-left:4px solid var(--vc)}
.sc2 .n{font-family:'DM Mono',monospace;font-size:1.65rem;font-weight:500;color:var(--vm);line-height:1}
.sc2 .l{font-size:.7rem;color:var(--cm);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
footer{background:var(--vd);color:rgba(255,255,255,.55);text-align:center;padding:18px 20px;font-size:.76rem;letter-spacing:.04em}
footer a{color:rgba(255,255,255,.75)}
/* ── Componentes do Meu Diário ── */
.md-btn{border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:.84rem;cursor:pointer;background:var(--md-sup3);color:var(--ce);border:1px solid var(--md-linha)}
.md-btn.pri{background:var(--md-acento);color:var(--md-acento-txt);border-color:var(--md-acento)}
.md-btn.perigo{background:var(--rs);color:var(--ra);border-color:#f5c6c0}
.md-btn.mini{padding:6px 10px;font-size:.75rem;border-radius:8px}
.md-btn:disabled{opacity:.5;cursor:not-allowed}
.md-card{background:var(--md-sup);border-radius:var(--r);box-shadow:var(--ss);padding:18px 20px;margin-bottom:16px}
.md-card h3{font-family:'Playfair Display',serif;color:var(--md-titulo);font-size:1.08rem;margin-bottom:10px}
.md-card p{font-size:.88rem;line-height:1.55;color:var(--cm)}
.md-f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.md-f label{font-size:.7rem;font-weight:700;color:var(--md-destaque);text-transform:uppercase;letter-spacing:.05em}
.md-f input,.md-f select,.md-f textarea,.md-in{padding:9px 11px;border:2px solid var(--md-linha);border-radius:10px;font:inherit;font-size:.9rem;color:var(--ce);background:var(--md-sup2);width:100%}
.md-f textarea{min-height:120px;resize:vertical}
.md-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.md-vazio{text-align:center;padding:40px 20px;color:var(--cm);font-size:.92rem}
.md-cont{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.md-cc{background:var(--md-sup);border-radius:12px;box-shadow:var(--ss);padding:14px 16px;border-top:4px solid var(--vc)}
.md-cc h4{font-size:.95rem;color:var(--md-titulo)}
.md-cc .sub{font-size:.76rem;color:var(--cm);margin:2px 0 10px}
.md-bar{height:9px;background:var(--md-linha);border-radius:99px;overflow:hidden;margin:4px 0 8px}
.md-bar i{display:block;height:100%;background:var(--vc)}
.md-bar.ano i{background:var(--ou)}
.md-lbl{display:flex;justify-content:space-between;font-size:.74rem;color:var(--cm)}
.md-bims{display:flex;gap:4px;margin-top:6px}
.md-bims span{flex:1;text-align:center;font-size:.66rem;padding:4px 0;border-radius:6px;background:var(--md-linha);color:var(--cm)}
.md-bims span.co{background:var(--vs);color:var(--vm);font-weight:700}
.md-bims span.at{background:var(--os);color:var(--og);font-weight:700}
.md-h3{font-family:'Playfair Display',serif;color:var(--md-titulo);margin:18px 0 10px;font-size:1.1rem}
.md-alunos{display:flex;flex-wrap:wrap;gap:6px}
.md-alunos button{border:1px solid var(--md-linha);background:var(--md-sup2);color:var(--ce);border-radius:999px;padding:5px 11px;font-size:.78rem;cursor:pointer}
.md-alunos button.tr{opacity:.5;text-decoration:line-through}
.md-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.md-row .md-in{flex:1}
.md-row .n{font-family:'DM Mono',monospace;font-size:.78rem;width:28px;color:var(--cm)}
.md-row label{font-size:.76rem;display:flex;gap:4px;align-items:center;white-space:nowrap}
.md-x{background:none;border:none;color:var(--ra);font-size:1.05rem;cursor:pointer;padding:4px}
details.md-turma{border:1px solid var(--md-linha);border-radius:12px;padding:0 14px;margin-bottom:12px;background:var(--md-sup)}
details.md-turma>summary{cursor:pointer;padding:13px 0;font-weight:700;color:var(--md-titulo)}
details.md-turma[open]>summary{border-bottom:1px solid var(--md-linha);margin-bottom:12px}
.md-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1a3a2a;color:#fff;padding:10px 18px;border-radius:999px;font-size:.84rem;z-index:20000;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:92vw;text-align:center}
.md-tabela{width:100%;border-collapse:collapse;font-size:.86rem}
.md-tabela td{padding:7px 4px;border-bottom:1px solid var(--md-linha)}
/* ── Cards de diário (padrão da Casavequia) ── */
.ea{background:var(--md-sup);border-radius:var(--r);box-shadow:var(--ss);margin-bottom:18px;overflow:hidden;transition:box-shadow .2s}
.ea:hover{box-shadow:0 6px 32px rgba(26,58,42,.14)}
.eh{display:flex;align-items:center;cursor:pointer;user-select:none}
.edb{background:var(--vd);color:#fff;padding:17px 19px;min-width:96px;text-align:center;flex-shrink:0}
.edb .d{font-family:'DM Mono',monospace;font-size:1.9rem;font-weight:500;line-height:1}
.edb .my{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;opacity:.74;margin-top:2px}
.em{flex:1;padding:13px 19px;display:flex;flex-direction:column;gap:5px;min-width:0}
.ed{font-family:'Playfair Display',serif;font-size:1.02rem;color:var(--vd);font-weight:600}
.ec{display:flex;flex-wrap:wrap;gap:5px}
.ch{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:.72rem;font-weight:500}
.ch-h{background:var(--vs);color:var(--vm)}.ch-p{background:var(--os);color:#7a5c10}
.ch-a{background:var(--rs);color:var(--ra)}.ch-i{background:#dbeeff;color:var(--ai)}
.et{padding:17px 19px;color:var(--cm);font-size:.95rem;transition:transform .25s;flex-shrink:0}.et.op{transform:rotate(180deg)}
.ec2{display:none;border-top:1px solid var(--cl)}.ec2.on{display:block}
.itabs{display:flex;background:#f5f3ee;border-bottom:1px solid var(--cl);padding:0 20px;overflow-x:auto}
.itab{padding:9px 13px;background:transparent;border:none;font-size:.77rem;font-weight:500;cursor:pointer;color:var(--cm);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.itab:hover{color:var(--vd)}.itab.on{color:var(--vm);border-bottom-color:var(--vm);font-weight:700}
.ipane{display:none;padding:18px 22px 22px}.ipane.on{display:block}
.st{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--cm);font-weight:700;margin:16px 0 7px}.st:first-child{margin-top:0}
.ct{background:var(--cr);border-left:3px solid var(--vc);padding:11px 15px;border-radius:0 var(--rs2) var(--rs2) 0;font-size:.88rem;line-height:1.65}
.ol{display:flex;flex-direction:column;gap:9px}
.oi{background:var(--rs);border:1px solid #f5c6c0;border-radius:var(--rs2);padding:11px 15px;display:flex;gap:11px;align-items:flex-start}
.oi.nt{background:#f0f7ff;border-color:#bdd9f5}
.oi-ic{font-size:1.05rem;flex-shrink:0}
.oa{font-weight:600;font-size:.86rem;color:var(--ra);margin-bottom:2px}.oi.nt .oa{color:var(--ai)}.od{font-size:.83rem;line-height:1.5}
.ng{background:var(--os);border:1px solid #e0c87a;border-radius:var(--rs2);padding:11px 15px;font-size:.84rem;line-height:1.6}
.ai2{margin-top:14px;background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:var(--rs2);padding:15px 17px;color:#fff}
.ai2h{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.ai2h .tg{background:rgba(201,168,76,.25);color:var(--ou);border:1px solid rgba(201,168,76,.4);border-radius:4px;font-size:.64rem;font-weight:700;letter-spacing:.12em;padding:2px 7px;text-transform:uppercase}
.ai2h span{font-size:.8rem;opacity:.7}
.ai2i{background:rgba(255,255,255,.07);border-radius:6px;padding:9px 11px;margin-bottom:7px;font-size:.83rem;line-height:1.55}
.ai2a{font-family:'DM Mono',monospace;color:var(--ou);font-size:.76rem;margin-bottom:2px}
.ai2p{display:inline-flex;background:rgba(192,57,43,.25);color:#ff8a8a;border-radius:4px;padding:1px 6px;font-size:.7rem;font-weight:600;margin-bottom:3px}
.ai2p.warn{background:rgba(230,126,34,.25);color:#ffc08a}.ai2p.grave{background:rgba(192,57,43,.45);color:#ff6b6b}
.ai2t{opacity:.85}.ai2s{margin-top:9px;border-top:1px solid rgba(255,255,255,.1);padding-top:9px;font-size:.78rem;opacity:.75;font-style:italic}
.lembrete{background:#1a1a2e;border:2px dashed var(--ou);border-radius:var(--rs2);padding:12px 16px;margin:14px 0;color:#fff}
.lembrete-tag{display:inline-flex;background:rgba(201,168,76,.3);color:var(--ou);border-radius:4px;font-size:.66rem;font-weight:700;letter-spacing:.1em;padding:2px 8px;text-transform:uppercase;margin-bottom:8px}
.lembrete-txt{font-size:.83rem;line-height:1.6;opacity:.9}
.atv-tema{background:var(--cr);border-left:3px solid var(--ou);padding:10px 14px;border-radius:0 var(--rs2) var(--rs2) 0;font-size:.87rem;margin-bottom:12px}
.atv-av{background:var(--os);border:1px solid #e0c87a;border-radius:var(--rs2);padding:9px 13px;font-size:.81rem;margin-bottom:12px;display:flex;gap:8px}
.md-mstat{font-size:.74rem;color:var(--cm);margin-bottom:10px;display:flex;gap:14px;flex-wrap:wrap}.md-mstat strong{color:var(--ce)}
.md-mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:5px}
.md-m{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:6px;font-size:.8rem;cursor:pointer;border:none;text-align:left;background:var(--md-sup3);color:var(--ce)}
.md-m .n{font-family:'DM Mono',monospace;font-size:.67rem;opacity:.6;width:20px;flex-shrink:0}
.md-m .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md-m .tag{font-size:.62rem;font-weight:700}
.md-m.pr,.md-m.fz{background:#e6f6ec;color:#1f6b43}.md-m.fa,.md-m.nf{background:#fde2df;color:#a4291d}.md-m.fj{background:#fff4d6;color:#7a5c10}

.md-ajuda{font-size:.74rem;color:var(--cm);margin-bottom:8px}

.md-ano{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;color:var(--md-destaque);background:var(--md-sup);border:1px solid var(--md-linha);border-radius:999px;padding:5px 6px 5px 14px}

.md-opcao:hover{border-color:var(--md-destaque);transform:translateY(-2px)}
.md-opcao span{font-size:1.6rem}.md-opcao b{font-size:.95rem;color:var(--md-titulo)}.md-opcao small{font-size:.78rem;color:var(--cm);line-height:1.45}
.md-escola{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}

.md-icones{display:flex;flex-wrap:wrap;gap:6px}

.md-inep{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--md-sup2);border:1px solid var(--md-linha);font-size:.86rem;line-height:1.55}

.md-perigo{border:2px solid rgba(192,57,43,.45)}

.md-imp{border:1px solid var(--md-linha);border-radius:10px;padding:10px 12px;margin-bottom:8px}

html.dark-2026 .md-bar i{background:var(--dark-positive)}

<body>
<header class="cab"><div class="cab-barra">
  <a class="md-sair md-voltar" href="escolas.html" title="Voltar para as escolas">← Escolas</a>
  <div id="modo-btns">
      <button type="button" class="btn-claro" id="modo-claro-btn" title="Modo claro" aria-label="Modo claro">☀️</button>
      <button type="button" class="btn-escuro" id="modo-escuro-btn" title="Modo escuro" aria-label="Modo escuro">🌙</button>
    </div>
</div><div class="cab-i">
  <div class="md-avatar" id="md-avatar" aria-hidden="true">🏫</div>
  <div class="cab-t">
    <h1 id="md-titulo">Diário de Aulas</h1>
    <div class="sub" id="md-escolas">Meu Diário</div>
  </div>
  <div class="md-cab-acoes">
    <span class="md-sync" id="md-sync">☁️ Conectando…</span>
    <a class="md-sair md-voltar" id="md-painel" href="#" hidden>🔀 Mudar painel</a>
    <a id="md-chip" href="perfil.html"></a>
  </div>
</div></header>
<nav class="nav-w"><div class="nav-i" id="md-tabs"></div></nav>
<main class="main" id="md-main">
  <section class="sec" id="sec-inicio"></section>
  <section class="sec" id="sec-plano"></section>
  <section class="sec" id="sec-seq"></section>
  <section class="sec" id="sec-livros"></section>
  <section class="sec" id="sec-cal"></section>
  <section class="sec" id="sec-cont"></section>
  <section class="sec" id="sec-ia"></section>
  <section class="sec" id="sec-config"></section>
</main>
<footer><span id="md-rodape">Meu Diário</span> &nbsp;|&nbsp; <a href="privacidade.html">Privacidade</a> · <a href="termos.html">Termos</a></footer>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   Meu Diário — plataforma de cada professor (Etapa 9 + Etapa 11)
   Dados particulares em professor_dados (RLS: só o dono), em três escopos:
     "meu-diario:estrutura:v1"  escolas, turmas, alunos e disciplinas (aqui)
     "meu-diario:diarios:v1"    diários (novo-diario.js)
     "meu-diario:recursos:v1"   plano de aulas, sequências, livros e calendário
                                (meu-diario-recursos.js)
   A aba 🤖 I.A (meu-diario-ia.js) usa a chave de API do próprio professor.
   Os módulos entram por window.MD_MODULOS e recebem a API window.MeuDiario.
   ═══════════════════════════════════════════════════════════════════════ */
function tog(h){var c=h.nextElementSibling,t=h.querySelector('.et'),o=c.classList.contains('on');c.classList.toggle('on',!o);if(t)t.classList.toggle('op',!o);}
function itab(btn,pid){var ec=btn.closest('.ec2');ec.querySelectorAll('.itab').forEach(function(b){b.classList.remove('on');});ec.querySelectorAll('.ipane').forEach(function(p){p.classList.remove('on');});btn.classList.add('on');var p=document.getElementById(pid);if(p)p.classList.add('on');}

// ── Tema claro / escuro (mesma chave "modo-tema" das páginas do administrador) ──
function setModo(modo){
  document.body.classList.toggle('modo-escuro',modo==='escuro');
  document.documentElement.classList.toggle('dark-2026',modo==='escuro');
  try{localStorage.setItem('modo-tema',modo);}catch(e){}
  var c=document.getElementById('modo-claro-btn'),e=document.getElementById('modo-escuro-btn');
  if(c)c.classList.toggle('ativo',modo==='claro');
  if(e)e.classList.toggle('ativo',modo==='escuro');
  var meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.setAttribute('content',modo==='escuro'?'#111315':'#1a3a2a');
  if(window.Relatorio2026Theme)window.Relatorio2026Theme.refresh();
}
setModo(window.MD_TEMA_INICIAL||'claro');
document.getElementById('modo-claro-btn').onclick=function(){setModo('claro');};
document.getElementById('modo-escuro-btn').onclick=function(){setModo('escuro');};

(function(){
  'use strict';
  var SCOPE_ESTRUTURA='meu-diario:estrutura:v1';
  var MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  var usuario=null, E=null, syncE=null, PRES={}, ATV={};
  var STATUS={};
  // Página de UMA escola (Etapa 14): meu-diario.html?escola=<id>. Turmas,
  // alunos, disciplinas, diários e contador valem por ano letivo.
  var ESCOLA_ID=new URLSearchParams(location.search).get('escola')||'';
  var ANO_LEGADO=2026; // turmas de antes da Etapa 14 (sem "ano") são de 2026
  var ANO=0, carregado=false;
  var ICONES=['🏫','🏛️','📚','📖','🎓','✏️','🌳','🌻','🌎','⭐','🔬','🎨','⚽','🎵','🧮','💡','🦉','🚀'];

  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function agora(){return new Date().toISOString();}
  function novoId(p){return p+Math.random().toString(36).slice(2,7)+Date.now().toString(36).slice(-3);}
  function slug(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,10)||'d';}
  function toast(msg){var t=document.createElement('div');t.className='md-toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},3000);}
  function lsKey(){return 'md_estrutura_'+usuario.id;}
  function turma(id){return (E.turmas||[]).filter(function(t){return t.id===id;})[0]||null;}
  function escola(id){return (E.escolas||[]).filter(function(e){return e.id===id;})[0]||null;}
  function dataBr(k){return k.slice(8,10)+'/'+k.slice(5,7)+'/'+k.slice(0,4);}
  function modulos(){return window.MD_MODULOS||[];}
  function cadaModulo(metodo,arg){var out=[];modulos().forEach(function(m){if(typeof m[metodo]==='function'){try{out.push(m[metodo](arg));}catch(e){console.warn('[MeuDiario]',m.nome,metodo,e);}}});return out;}
  function rotuloCurto(nome){var m=/^\s*(\d+\s*[ºª°]?)/.exec(nome||'');return m?m[1].replace(/\s+/g,''):(String(nome||'?').trim().slice(0,2)||'?');}
  function C(){return window.ContaSkin;}

  // ── Escola e ano letivo abertos ─────────────────────────────────────
  function anoDe(t){return parseInt(t.ano,10)||ANO_LEGADO;}
  function escolaAtual(){return escola(ESCOLA_ID);}
  function turmasDaEscola(){return (E.turmas||[]).filter(function(t){return t.escolaId===ESCOLA_ID;});}
  function turmasVis(){return turmasDaEscola().filter(function(t){return anoDe(t)===ANO;});}
  function anosComTurmas(){var m={};turmasDaEscola().forEach(function(t){m[anoDe(t)]=1;});return Object.keys(m).map(Number).sort(function(a,b){return a-b;});}
  function anosDaEscola(){var m={};m[new Date().getFullYear()]=1;m[ANO]=1;anosComTurmas().forEach(function(a){m[a]=1;});return Object.keys(m).map(Number).sort(function(a,b){return a-b;});}
  // O ano escolhido vale só nesta sessão: ao abrir de novo, volta ao ano corrente.
  function anoInicial(){var a=0;try{a=parseInt(sessionStorage.getItem('md_ano_'+ESCOLA_ID),10)||0;}catch(x){}return a||new Date().getFullYear();}
  function mudarAno(a){
    ANO=a;try{sessionStorage.setItem('md_ano_'+ESCOLA_ID,String(a));}catch(x){}
    desenharTudo();
    if(window.NovoDiario)window.NovoDiario.renderizar();
    irPara('inicio');
  }
  function diarios(){
    if(!window.NovoDiario)return[];
    var ids={};turmasVis().forEach(function(t){ids[t.id]=1;});
    return window.NovoDiario.diarios().filter(function(d){return ids[d.turma];});
  }
  function perfilNome(){var p=C()&&C().perfil.dados();return (p&&p.nome)||(E.perfil&&E.perfil.nome)||usuario.nome||'';}
  // O que os módulos (recursos e I.A) enxergam: só a escola e o ano abertos.
  function vista(){var e=escolaAtual();return{versao:E.versao,perfil:{nome:perfilNome()},escolas:e?[e]:[],turmas:turmasVis(),atualizadoEm:E.atualizadoEm,ano:ANO};}

  // ── Estrutura: local + banco ─────────────────────────────────────────
  function vazia(){return{versao:1,perfil:{nome:(usuario&&usuario.nome)||''},escolas:[],turmas:[],atualizadoEm:''};}
  function lerLocal(){try{var e=JSON.parse(localStorage.getItem(lsKey())||'null');if(e&&Array.isArray(e.turmas))return e;}catch(x){}return vazia();}
  function salvar(motivo){
    // Nada é gravado antes de ler o banco: um aparelho desatualizado não
    // sobrescreve o que foi feito em outro.
    if(!carregado){toast('Aguarde: sincronizando os seus dados…');return Promise.resolve(false);}
    E.atualizadoEm=agora();
    try{localStorage.setItem(lsKey(),JSON.stringify(E));}catch(x){}
    var p=syncE?syncE.pushNow('force'):Promise.resolve(false);
    desenharTudo();
    if(window.NovoDiario)window.NovoDiario.renderizar();
    return p;
  }
  function aplicarRemotoEstrutura(payload){
    if(!payload||!Array.isArray(payload.turmas))return;
    if(String(payload.atualizadoEm||'')<String(E.atualizadoEm||''))
      {if(syncE)syncE.schedulePush('local-mais-novo');return;}
    E=payload;
    try{localStorage.setItem(lsKey(),JSON.stringify(E));}catch(x){}
    if(!carregado)return;
    if(!escolaAtual()){location.replace('escolas.html');return;}
    desenharTudo();
    if(window.NovoDiario)window.NovoDiario.renderizar();
  }

  // ── Estado da sincronização (todos os escopos) ──────────────────────
  function status(chave,s){STATUS[chave]=s;mostrarStatus();}
  function mostrarStatus(){
    var el=document.getElementById('md-sync');if(!el)return;
    var s=Object.keys(STATUS).map(function(k){return STATUS[k];});
    var h=new Date();var hh=('0'+h.getHours()).slice(-2)+':'+('0'+h.getMinutes()).slice(-2);
    if(s.indexOf('offline')>=0||!navigator.onLine)el.textContent='📴 Sem internet — salvo neste aparelho';
    else if(s.indexOf('erro')>=0)el.textContent='⚠️ Falha ao sincronizar — tentando de novo';
    else if(s.indexOf('salvando')>=0)el.textContent='☁️ Salvando…';
    else if(s.indexOf('conectando')>=0)el.textContent='☁️ Conectando…';
    else el.textContent='☁️ Sincronizado às '+hh;
  }

  // ── Abas ────────────────────────────────────────────────────────────
  var abaAtual='';
  function abas(){
    return [{id:'inicio',rotulo:'🏠 Início'}]
      .concat(turmasVis().map(function(t){return{id:t.id,rotulo:t.nome};}))
      .concat([{id:'plano',rotulo:'📚 Plano de Aulas'},{id:'seq',rotulo:'🗂 Sequências'},{id:'livros',rotulo:'📖 Livros'},{id:'cal',rotulo:'📆 Calendário'},{id:'cont',rotulo:'📊 Contador'},{id:'ia',rotulo:'🤖 I.A'},{id:'config',rotulo:'⚙️ Configurações'}]);
  }
  function irPara(id){
    if(!document.getElementById('sec-'+id))id='inicio';
    abaAtual=id;
    try{localStorage.setItem('md_aba',id);}catch(x){}
    document.querySelectorAll('#md-main>.sec').forEach(function(s){s.classList.toggle('on',s.id==='sec-'+id);});
    document.querySelectorAll('.nb[data-aba]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-aba')===id);});
    cadaModulo('aoAbrir',id);
    window.scrollTo(0,0);
  }
  function desenharAbas(){
    document.getElementById('md-tabs').innerHTML=abas().map(function(a,i){return (i?'<div class="sp"></div>':'')+'<button type="button" class="nb" data-aba="'+esc(a.id)+'">'+esc(a.rotulo)+'</button>';}).join('');
    document.querySelectorAll('.nb[data-aba]').forEach(function(b){b.addEventListener('click',function(){irPara(b.getAttribute('data-aba'));});});
  }

  // ── Seções das turmas (os cards entram pelo novo-diario.js) ─────────
  function garantirSecoes(){
    var main=document.getElementById('md-main'),ref=document.getElementById('sec-plano');
    var vis=turmasVis(),ids=vis.map(function(t){return t.id;});
    main.querySelectorAll('section[data-turma]').forEach(function(s){if(ids.indexOf(s.getAttribute('data-turma'))<0)s.remove();});
    vis.forEach(function(t){
      var sec=document.getElementById('sec-'+t.id);
      if(!sec){
        sec=document.createElement('section');sec.className='sec';sec.id='sec-'+t.id;sec.setAttribute('data-turma',t.id);
        sec.innerHTML='<div class="th"></div><div class="md-acoes"></div><div class="sr"></div><div class="md-lista"></div>';
        main.insertBefore(sec,ref);
      }
      var esc1=escola(t.escolaId);
      sec.querySelector('.th').innerHTML='<div class="tb">'+esc(rotuloCurto(t.nome))+'</div><div class="ti"><h2>'+esc(t.nome)+'</h2><p>'+esc(esc1?esc1.nome:'Sem escola')+' · '+anoDe(t)+' · '+t.alunos.filter(function(a){return!a.tr;}).length+' alunos · '+esc(t.disciplinas.map(function(d){return d.nome;}).join(', ')||'sem disciplinas')+'</p></div>';
      sec.querySelector('.md-acoes').innerHTML='<button type="button" class="md-btn pri" data-acao="novo">+ Novo Diário</button>'
        +'<button type="button" class="md-btn" data-acao="alunos">👥 Relatório dos alunos</button>'
        +'<button type="button" class="md-btn" data-acao="ia">🤖 Registrar com a I.A</button>';
      sec.querySelector('[data-acao="novo"]').onclick=function(){
        if(!t.disciplinas.length){toast('Cadastre ao menos uma disciplina em ⚙️ Configurações.');irPara('config');return;}
        if(!t.alunos.length){toast('Cadastre os alunos da turma em ⚙️ Configurações.');irPara('config');return;}
        window.novoDiarioAbrir(t.id);
      };
      sec.querySelector('[data-acao="alunos"]').onclick=function(){abrirListaAlunos(t.id);};
      sec.querySelector('[data-acao="ia"]').onclick=function(){irPara('ia');if(window.MeuDiarioIA)window.MeuDiarioIA.sugerir('Registre a aula de hoje da turma '+t.nome+': ');};
      var lista=sec.querySelector('.md-lista');
      if(!lista.querySelector('.md-vazio'))lista.insertAdjacentHTML('afterbegin','<div class="md-card md-vazio" hidden>Nenhum diário ainda. Toque em <strong>+ Novo Diário</strong> para registrar a primeira aula — ou peça à 🤖 I.A.</div>');
    });
  }

  // Soma de h/aula por turma e disciplina.
  function somaHoras(){
    var m={};
    diarios().forEach(function(d){var k=d.turma+'|'+d.disc;m[k]=(m[k]||0)+(parseInt(d.horas,10)||0);});
    return m;
  }

  function desenharEstatisticasTurmas(){
    var soma=somaHoras();
    turmasVis().forEach(function(t){
      var sec=document.getElementById('sec-'+t.id);if(!sec)return;
      var ds=diarios().filter(function(d){return d.turma===t.id;});
      var horas=t.disciplinas.reduce(function(s,d){return s+(soma[t.id+'|'+d.id]||0);},0);
      var ultimo=ds.map(function(d){return d.dateKey;}).sort().pop();
      var faltas=ds.reduce(function(s,d){return s+((d.rel&&d.rel.faltaram)||[]).length;},0);
      sec.querySelector('.sr').innerHTML=
        '<div class="sc2"><div class="n">'+ds.length+'</div><div class="l">Diários</div></div>'
        +'<div class="sc2"><div class="n">'+horas+'</div><div class="l">H/aula dadas</div></div>'
        +'<div class="sc2"><div class="n">'+t.alunos.filter(function(a){return!a.tr;}).length+'</div><div class="l">Alunos</div></div>'
        +'<div class="sc2 al"><div class="n">'+faltas+'</div><div class="l">Faltas registradas</div></div>'
        +'<div class="sc2"><div class="n">'+(ultimo?dataBr(ultimo).slice(0,5):'—')+'</div><div class="l">Último registro</div></div>';
      var v=sec.querySelector('.md-vazio');if(v)v.hidden=ds.length>0;
    });
  }

  // ── Presença e atividades clicáveis ─────────────────────────────────
  var ROT={pr:'Presente',fa:'Falta',fj:'Falta just.',fz:'Fez',nf:'Não fez',au:'—'};
  var PROX_P={pr:'fa',fa:'fj',fj:'pr'}, PROX_A={au:'fz',fz:'nf',nf:'au'};
  function estadoP(d,n){var r=d.rel||{};return (r.faltaram||[]).indexOf(n)>=0?'fa':(r.faltJ||[]).indexOf(n)>=0?'fj':'pr';}
  function estadoA(d,n){var a=(d.rel||{}).atividade||{};return (a.fez||[]).indexOf(n)>=0?'fz':(a.naoFez||[]).indexOf(n)>=0?'nf':'au';}
  function desenharMarcacoes(){
    var porId={};diarios().forEach(function(d){porId[d.id]=d;});
    document.querySelectorAll('[data-md-pres],[data-md-atv]').forEach(function(host){
      var tipo=host.hasAttribute('data-md-pres')?'p':'a';
      var id=host.getAttribute(tipo==='p'?'data-md-pres':'data-md-atv');
      var d=porId[id],t=d&&turma(d.turma);if(!d||!t)return;
      var cont={};
      var html=t.alunos.map(function(a){

  function preservar(sec,desenhar){
    var val={},abertos={},foco=null,campos=sec.querySelectorAll('input:not([type=file]),textarea,select');
    campos.forEach(function(el){
      var mudou=el.type==='checkbox'?el.checked!==el.defaultChecked:el.tagName==='SELECT'?[].some.call(el.options,function(o){return o.selected!==o.defaultSelected;}):el.value!==el.defaultValue;
      if(mudou)val[chaveCampo(el)]=el.type==='checkbox'?el.checked:el.value;
      if(el===document.activeElement)foco={k:chaveCampo(el),i:el.selectionStart,f:el.selectionEnd};
    });
    sec.querySelectorAll('details[data-t][open]').forEach(function(d){abertos[d.getAttribute('data-t')]=1;});
    desenhar();
    sec.querySelectorAll('details[data-t]').forEach(function(d){if(abertos[d.getAttribute('data-t')])d.open=true;});

      var k=chaveCampo(el);
      if(k in val){if(el.type==='checkbox')el.checked=val[k];else el.value=val[k];}
      if(foco&&foco.k===k){el.focus();try{el.setSelectionRange(foco.i,foco.f);}catch(x){}}
    });
  }

  // Usada pelo formulário e pela I.A. A turma nasce na escola e no ano abertos.

  function criarTurma(o){
    if(!carregado)return{erro:'Aguarde: sincronizando os seus dados.'};
    if(!escolaAtual())return{erro:'Abra uma escola para criar turmas.'};
    if(!String(o.nome||'').trim())return{erro:'Informe o nome da turma.'};
    var meta=Math.max(1,parseInt(o.meta,10)||10);
    var vistos={};
    var disciplinas=(o.disciplinas||[]).map(function(d){return typeof d==='string'?{nome:d}:d;}).filter(function(d){return d&&String(d.nome||'').trim();}).map(function(d){
      var nome=String(d.nome).trim(),id=slug(nome);while(vistos[id])id+='x';vistos[id]=1;
      var mb=Math.max(1,parseInt(d.metaBim,10)||meta);
      return{id:id,nome:nome,metaBim:mb,total:Math.max(mb,parseInt(d.total,10)||mb*4)};
    });
    var alunos=(o.alunos||[]).map(function(s){return String(s||'').replace(/^\s*\d+[\s.)-]*/,'').trim();}).filter(Boolean).map(function(nm,i){return{n:i+1,nm:nm};});
    var t={id:novoId('t'),nome:String(o.nome).trim(),escolaId:ESCOLA_ID,ano:parseInt(o.ano,10)||ANO,alunos:alunos,disciplinas:disciplinas};
    E.turmas.push(t);
    salvar('turma');
    return{turma:t};
  }

  // Acrescenta alunos no fim da chamada (sem salvar). Ignora nomes repetidos.
  function adicionarAlunos(t,nomes,permitirRepetido){
    var prox=t.alunos.reduce(function(m,a){return Math.max(m,a.n);},0),novos=[];
    var ja={};t.alunos.forEach(function(a){ja[a.nm.trim().toLowerCase()]=1;});
    (nomes||[]).map(function(s){return String(s||'').replace(/^\s*\d+[\s.)-]*/,'').trim();}).filter(Boolean).forEach(function(nm){
      if(!permitirRepetido&&ja[nm.toLowerCase()])return;
      ja[nm.toLowerCase()]=1;var a={n:++prox,nm:nm};t.alunos.push(a);novos.push(a);
    });
    return novos;
  }
  function adicionarDisciplina(t,o){
    var nome=String(o.nome||'').trim();if(!nome)return null;
    var jaExiste=t.disciplinas.filter(function(d){return d.nome.toLowerCase()===nome.toLowerCase();})[0];if(jaExiste)return jaExiste;
    var id=slug(nome);while(t.disciplinas.some(function(d){return d.id===id;}))id+='x';
    var meta=Math.max(1,parseInt(o.metaBim,10)||(t.disciplinas[0]&&t.disciplinas[0].metaBim)||10);
    var d={id:id,nome:nome,metaBim:meta,total:Math.max(meta,parseInt(o.total,10)||meta*4)};
    t.disciplinas.push(d);return d;
  }

    var t=turma(tid);
    abrirOverlay('<h2>Relatório dos alunos — '+esc(t.nome)+'</h2><p style="font-size:.86rem;color:var(--cm);margin:6px 0 14px">Escolha o aluno para ver frequência, atividades e ocorrências.</p><div class="md-alunos">'
      +t.alunos.map(function(a){return '<button type="button" class="'+(a.tr?'tr':'')+'" data-n="'+a.n+'">'+a.n+'. '+esc(a.nm)+'</button>';}).join('')+'</div>'
      +'<div class="md-noprint" style="margin-top:16px;text-align:right"><button type="button" class="md-btn" data-fechar>Fechar</button></div>',function(ov){
        ov.querySelectorAll('[data-n]').forEach(function(b){b.onclick=function(){abrirRelatorio(tid,parseInt(b.getAttribute('data-n'),10));};});
      });
  }
  function abrirRelatorio(tid,n){
    var t=turma(tid),a=t.alunos.filter(function(x){return x.n===n;})[0];
    var ds=diarios().filter(function(d){return d.turma===tid;}).sort(function(x,y){return (x.dateKey+x.ini).localeCompare(y.dateKey+y.ini);});
    var porDisc={},faltas=[],atvs=[],ocs=[];
    ds.forEach(function(d){
      var h=parseInt(d.horas,10)||1,s=estadoP(d,n);
      var k=d.discNome||'';porDisc[k]=porDisc[k]||{aulas:0,falt:0,fz:0,nf:0};
      porDisc[k].aulas+=h;
      if(s!=='pr'){porDisc[k].falt+=h;faltas.push({d:d,s:s});}
      if(d.rel&&d.rel.atividade&&d.rel.atividade.houve){var sa=estadoA(d,n);if(sa==='fz')porDisc[k].fz++;if(sa==='nf')porDisc[k].nf++;atvs.push({d:d,s:sa});}
      ((d.rel&&d.rel.comportamento)||[]).forEach(function(c){if((c.alunos||[]).indexOf(n)>=0)ocs.push({d:d,c:c});});
    });
    var linhas=Object.keys(porDisc).map(function(k){var p=porDisc[k];var freq=p.aulas?Math.round((p.aulas-p.falt)/p.aulas*100):100;return '<tr><td>'+esc(k)+'</td><td>'+p.aulas+'</td><td>'+p.falt+'</td><td><strong>'+freq+'%</strong></td><td>'+p.fz+' / '+(p.fz+p.nf)+'</td></tr>';}).join('');
    var esc1=escola(t.escolaId);
    abrirOverlay('<h2>'+esc(a.nm)+'</h2><p style="font-size:.86rem;color:var(--cm);margin-top:4px">'+esc(t.nome)+' · '+anoDe(t)+' · Nº '+a.n+(esc1?' · '+esc(esc1.nome):'')+(esc1&&esc1.inep?' (INEP '+esc1.inep.codigo+')':'')+' · Professor(a): '+esc(perfilNome()||usuario.email)+' · Emitido em '+new Date().toLocaleDateString('pt-BR')+'</p>'
      +'<h4>Frequência e atividades por disciplina</h4>'+(linhas?'<table><tr><th>Disciplina</th><th>H/aula</th><th>Faltas (h)</th><th>Frequência</th><th>Atividades feitas</th></tr>'+linhas+'</table>':'<p>Nenhum diário registrado.</p>')
      +'<h4>Faltas</h4>'+(faltas.length?'<table>'+faltas.map(function(f){return '<tr><td>'+dataBr(f.d.dateKey)+'</td><td>'+esc(f.d.discNome)+'</td><td>'+(f.s==='fj'?'Justificada':'Falta')+'</td><td>'+esc(f.d.assunto)+'</td></tr>';}).join('')+'</table>':'<p>Nenhuma falta.</p>')
      +'<h4>Atividades</h4>'+(atvs.length?'<table>'+atvs.map(function(x){return '<tr><td>'+dataBr(x.d.dateKey)+'</td><td>'+esc(x.d.discNome)+'</td><td>'+esc(x.d.rel.atividade.titulo||x.d.assunto)+'</td><td>'+({fz:'Fez',nf:'Não fez',au:'Sem marcação'})[x.s]+'</td></tr>';}).join('')+'</table>':'<p>Nenhuma atividade registrada.</p>')
      +'<h4>Observações de conduta</h4>'+(ocs.length?'<table>'+ocs.map(function(o){return '<tr><td>'+dataBr(o.d.dateKey)+'</td><td>'+esc(o.d.discNome)+'</td><td>'+({advertencia:'⚠️ Advertência',grave:'🚨 Grave',destaque:'✅ Destaque'})[o.c.tipo]+'</td><td>'+esc(o.c.texto)+'</td></tr>';}).join('')+'</table>':'<p>Nenhuma ocorrência.</p>')
      +'<div class="md-noprint" style="margin-top:18px;display:flex;gap:10px;justify-content:flex-end"><button type="button" class="md-btn" data-voltar>← Alunos</button><button type="button" class="md-btn pri" data-imprimir>🖨️ Imprimir / Salvar PDF</button></div>',function(ov){
        ov.querySelector('[data-voltar]').onclick=function(){abrirListaAlunos(tid);};
        ov.querySelector('[data-imprimir]').onclick=function(){document.body.classList.add('md-imprimindo');window.print();setTimeout(function(){document.body.classList.remove('md-imprimindo');},500);};
      });
  }
  function abrirOverlay(html,ligar){
    var velho=document.querySelector('.md-ov');if(velho)velho.remove();
    var ov=document.createElement('div');ov.className='md-ov';ov.innerHTML='<div class="md-rel" role="dialog" aria-modal="true">'+html+'</div>';
    ov.addEventListener('mousedown',function(e){if(e.target===ov)ov.remove();});
    document.body.appendChild(ov);
    ov.querySelectorAll('[data-fechar]').forEach(function(f){f.onclick=function(){ov.remove();};});
    if(ligar)ligar(ov);
    return ov;
  }

  // ── Desenho geral ───────────────────────────────────────────────────
  function desenharCabecalho(){
    var nome=perfilNome(),e=escolaAtual();
    document.getElementById('md-titulo').textContent='Diário de Aulas '+ANO;
    if(window.RelatorioAnoLetivo)window.RelatorioAnoLetivo.atualizar();
    document.getElementById('md-escolas').textContent=e?e.nome+(e.inep?' · INEP '+e.inep.codigo:''):'Carregando…';
    var av=document.getElementById('md-avatar');
    if(e&&e.imagem)av.innerHTML='<img src="'+esc(e.imagem)+'" alt="">';else av.textContent=(e&&e.icone)||'🏫';
    document.getElementById('md-rodape').textContent=(e?e.nome+' · ':'')+(nome?nome+' · ':'')+'Ano Letivo '+ANO;
    if(e)document.title=e.nome+' — Meu Diário';
    var pn=document.getElementById('md-painel');
    if(pn)C().ocupacao.botaoPainel(pn,e,'regente');
  }
  // Ocupação obrigatória (Etapa 15). Sem "regente", esta escola abre no painel do AEE.
  function conferirOcupacao(){
    var e=escolaAtual();if(!e)return true;
    if(!(e.ocupacoes||[]).length){
      C().ocupacao.escolher(e.nome,[]).then(function(l){
        if(!l){location.replace('escolas.html');return;}
        e.ocupacoes=l;salvar('ocupacao').then(function(){if(l.indexOf('regente')<0)location.replace(C().ocupacao.destino(e));});
      });
      return true;
    }
    if(e.ocupacoes.indexOf('regente')<0){location.replace(C().ocupacao.destino(e));return false;}
    return true;
  }
  function desenharTudo(){
    desenharCabecalho();
    if(!escolaAtual()){desenharAbas();return;}
    desenharAbas();garantirSecoes();desenharInicio();desenharConfig();desenharContador();desenharEstatisticasTurmas();
    cadaModulo('desenhar');
    irPara(abaAtual||(function(){try{return localStorage.getItem('md_aba');}catch(x){return '';}})()||'inicio');
  }
  function aposRenderDiarios(){if(!escolaAtual())return;desenharMarcacoes();desenharEstatisticasTurmas();desenharContador();if(abaAtual==='inicio')desenharInicio();cadaModulo('aposDiarios');}

  // ── Adaptador do novo-diario.js ─────────────────────────────────────
  function adaptador(){
    return {
      chave:'md', perUser:true, scope:'meu-diario:diarios:v1', lsKey:'md_diarios_'+usuario.id, schoolSlug:'meu-diario',
      turmas:function(){return turmasVis().map(function(t){return t.id;});},
      comHoras:true, presencaNeutra:false,
      rotulo:function(t){var x=turma(t);return x?x.nome:t;},
      alunos:function(t){var x=turma(t);return x?x.alunos:[];},
      disciplinas:function(t){var x=turma(t);return x?x.disciplinas.map(function(d){return d.nome;}):[];},
      pres:function(){return PRES;}, atv:function(){return ATV;},
      kPres:function(id){return 'pl-'+id;}, kAtv:function(id){return 'atv-'+id;},
      codigoDisc:function(nome,t){var x=turma(t);var d=x&&x.disciplinas.filter(function(y){return y.nome===nome;})[0];return d?d.id:slug(nome);},
      discDoTitulo:function(){return '';},
      novoId:function(t,dateKey,discNome,ignorar){
        var base=t+'-'+dateKey.slice(5,7)+dateKey.slice(8,10)+this.codigoDisc(discNome,t);
        var usados={};window.NovoDiario.diarios().forEach(function(d){usados[d.id]=1;});
        var letras=['','a','b','c','d','e','f','g','h'];
        for(var i=0;i<letras.length;i++){var id=base+letras[i];if(id===ignorar||(!usados[id]&&!document.getElementById('r-'+id)))return id;}
        return '';
      },
      mesmoId:function(s){return s.dateKey===s.dateKey0&&s.discNome===s.discNome0;},
      tituloCard:function(d){var x=turma(d.turma);var disc=x&&x.disciplinas.filter(function(y){return y.id===d.disc;})[0];return (disc?disc.nome:d.discNome)+' — '+d.horas+'h/aula';},
      estadoPresenca:function(id,n){var c=PRES['pl-'+id]||{faltaram:[],faltJ:[]};return c.faltaram.indexOf(n)>=0?'fa':c.faltJ.indexOf(n)>=0?'fj':'pr';},
      estadoAtividade:function(id,n){var c=ATV['atv-'+id]||{fez:[],naoFez:[]};return c.fez.indexOf(n)>=0?'fz':c.naoFez.indexOf(n)>=0?'nf':'au';},
      parcialPresenca:function(){return false;}, parcialAtividade:function(){return false;},
      temAtividade:function(id){return !!ATV['atv-'+id];},
      limparCliques:function(){},
      paineis:function(d){
        var atv=(d.rel&&d.rel.atividade)||{};
        return {
          p:'<div data-md-pres="'+esc(d.id)+'"></div>',
          a:atv.houve
            ?'<div class="atv-tema"><strong>'+esc(atv.titulo||'Atividade')+'</strong>'+(atv.descricao?'<br><span style="font-size:.82rem;color:var(--cm)">'+esc(atv.descricao)+'</span>':'')+'</div><div data-md-atv="'+esc(d.id)+'"></div>'
            :'<div class="atv-av"><span>📋</span><span>Nenhuma atividade nesta aula. Para registrar, toque em ✏️ e marque "Houve atividade".</span></div>'
        };
      },
      sincronizar:aposRenderDiarios,
      durEmTitulo:function(txt){var m=/(\d+)\s*h\/aula/i.exec(txt||'');return m?{horas:parseInt(m[1],10)}:null;},
      aoStatus:function(s){status('diarios',s);}
    };
  }

  // ── API para os módulos (recursos e I.A) ────────────────────────────
  window.MeuDiario={
    esc:esc, toast:toast, novoId:novoId, slug:slug, agora:agora, dataBr:dataBr, MESES:MESES,
    usuario:function(){return usuario;}, estrutura:vista,
    turma:turma, escola:escola, diarios:diarios, somaHoras:somaHoras,
    salvarEstrutura:salvar, criarTurma:criarTurma, adicionarAlunos:adicionarAlunos, adicionarDisciplina:adicionarDisciplina,
    irPara:irPara, abaAtual:function(){return abaAtual;}, abrirOverlay:abrirOverlay, status:status,
    escolaAtual:function(){return ESCOLA_ID;}, ano:function(){return ANO;},
    sync:function(){return window.RelatorioSupabaseSync;}
  };

  // ── Início da página ────────────────────────────────────────────────
  function iniciar(){
    var S=window.RelatorioSupabaseSync;
    usuario=S.auth.currentUser();
    if(!ESCOLA_ID){location.replace('escolas.html');return;}
    ANO=anoInicial();
    E=lerLocal();
    if(!E.perfil||!E.perfil.nome){E.perfil=E.perfil||{};E.perfil.nome=usuario.nome||'';}
    C().perfil.iniciar();
    C().chip(document.getElementById('md-chip'));
    ligarAnoLetivo();
    C().perfil.aoMudar(function(){if(E)desenharCabecalho();});
    cadaModulo('iniciar',window.MeuDiario);
    if(escolaAtual())desenharTudo();else document.getElementById('sec-inicio').innerHTML='<div class="md-card md-vazio">Carregando a escola…</div>',document.getElementById('sec-inicio').classList.add('on');
    syncE=S.createScopeSync({
      perUser:true, scope:SCOPE_ESTRUTURA, source:'meu-diario', debounceMs:250,
      getLocalPayload:function(){return E;},
      onRemotePayload:aplicarRemotoEstrutura,
      onStatus:function(s){status('estrutura',s);}
    });
    syncE.start().then(function(){
      carregado=true;
      if(!escolaAtual()){location.replace('escolas.html');return;}
      if(!conferirOcupacao())return;
      desenharTudo();
      if(window.NovoDiario)window.NovoDiario.renderizar();
    });
    window.NovoDiario.iniciar(adaptador());
    window.addEventListener('online',mostrarStatus);window.addEventListener('offline',mostrarStatus);
  }
  function quandoPronto(){
    var S=window.RelatorioSupabaseSync;
    if(!S||!window.NovoDiario||!window.ContaSkin){setTimeout(quandoPronto,50);return;}
    S.auth.whenAuthorized().then(function(){if(!usuario)iniciar();});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',quandoPronto);else quandoPronto();
})();
</script>
